/* ─────────────── UTILITIES ─────────────── */
function gcd(a, b) { while (b) { [a, b] = [b, a % b]; } return a; }

function euclideanSteps(a, b) {
  const steps = [];
  while (b !== 0) {
    const q = Math.floor(a / b);
    const r = a % b;
    steps.push({ a, b, q, r });
    a = b; b = r;
  }
  return steps;
}

function sqrtCF(r, maxTerms = 20) {
  const a0 = Math.floor(Math.sqrt(r));
  if (a0 * a0 === r) return { terms: [a0], period: [], convergents: [{ p: a0, q: 1 }], perfect: true };
  const terms = [a0];
  const states = [];
  let m = a0, d = r - a0 * a0;
  const convergents = [{ p: a0, q: 1 }];
  let p_prev = 1, p_curr = a0, q_prev = 0, q_curr = 1;
  for (let i = 0; i < maxTerms; i++) {
    const an = Math.floor((a0 + m) / d);
    terms.push(an);
    const mNext = an * d - m;
    const dNext = (r - mNext * mNext) / d;
    states.push({ m, d, an, mNext, dNext });
    const p_new = an * p_curr + p_prev;
    const q_new = an * q_curr + q_prev;
    convergents.push({ p: p_new, q: q_new });
    p_prev = p_curr; p_curr = p_new;
    q_prev = q_curr; q_curr = q_new;
    m = mNext; d = dNext;
    if (an === 2 * a0) break;
  }
  return { terms, period: terms.slice(1), convergents, states, a0, perfect: false };
}

function buildSquares(a, b, steps) {
  const squares = [];
  let x = 0, y = 0, horizontal = true, w = a, h = b, colorIdx = 0;
  for (const step of steps) {
    for (let i = 0; i < step.q; i++) {
      const side = horizontal ? h : w;
      squares.push({ x, y, size: side, colorIdx: colorIdx % 8, group: colorIdx, stepIdx: squares.length });
      if (horizontal) x += side; else y += side;
    }
    if (horizontal) w -= step.q * h; else h -= step.q * w;
    horizontal = !horizontal; colorIdx++;
  }
  return squares;
}

function factorsOf(n) {
  const factors = [];
  for (let i = 1; i <= n; i++) {
    if (n % i === 0) factors.push(i);
  }
  return factors;
}

// Continued-fraction style recipe formatting:
// [q0; q1,q2,...] (semicolon after the first quotient, commas after that).
function formatRRSRecipe(quotients) {
  const qs = Array.isArray(quotients) ? quotients.filter(q => Number.isFinite(q)) : [];
  if (qs.length === 0) return "[]";
  if (qs.length === 1) return `[${qs[0]}]`;
  return `[${qs[0]}; ${qs.slice(1).join(",")}]`;
}

function backwardBuild(smallestSize, counts) {
  const stages = [];
  const sizeTrail = [smallestSize];
  let previousSize = 0;
  let currentSize = smallestSize;

  counts.forEach((count, idx) => {
    const nextSize = count * currentSize + previousSize;
    stages.push({
      idx,
      count,
      squareSize: currentSize,
      previousSize,
      nextSize,
      landsAtRectangle: idx === counts.length - 1,
    });
    previousSize = currentSize;
    currentSize = nextSize;
    sizeTrail.push(nextSize);
  });

  return {
    stages,
    sizeTrail,
    finalWidth: currentSize,
    finalHeight: previousSize,
    forwardSequence: [...counts].reverse(),
    reverseSequence: counts,
  };
}

function metallicConvergents(n, count = 7) {
  const terms = [n, ...Array(Math.max(0, count - 1)).fill(n)];
  const convergents = [];
  let pPrev = 1, qPrev = 0;
  let pCurr = terms[0], qCurr = 1;
  convergents.push({ p: pCurr, q: qCurr, index: 0 });
  for (let i = 1; i < terms.length; i++) {
    const a = terms[i];
    const pNext = a * pCurr + pPrev;
    const qNext = a * qCurr + qPrev;
    convergents.push({ p: pNext, q: qNext, index: i });
    pPrev = pCurr; qPrev = qCurr;
    pCurr = pNext; qCurr = qNext;
  }
  return convergents;
}

/* ─────────────── TEACHER BUBBLE (TYPEWRITER) ─────────────── */
function TeacherBubble({ text, onDone, speed = 40 }) {
  const [shown, setShown] = useState("");
  const onDoneRef = useRef(onDone);
  // Keep ref up to date without triggering effect re-runs
  useEffect(() => { onDoneRef.current = onDone; }, [onDone]);

  useEffect(() => {
    setShown("");
    let i = 0;
    let finished = false;
    const timer = setInterval(() => {
      i++;
      setShown(text.slice(0, i));
      if (i >= text.length && !finished) {
        finished = true;
        clearInterval(timer);
        if (onDoneRef.current) onDoneRef.current();
      }
    }, speed);
    return () => clearInterval(timer);
  }, [text, speed]);  // only re-run when text or speed changes

  return (
    <div style={styles.teacherRow}>
      <div style={styles.teacherAvatar}>🧑‍🏫</div>
      <div style={styles.teacherBubble}>
        {shown}
        {shown.length < text.length && <span style={styles.teacherCursor}>▊</span>}
      </div>
    </div>
  );
}

}

/* ─────────────── RRS TUTORIAL ─────────────── */
function RRSTutorial({ initialStep = 0, divisionDone = false, onTryAgain, onPickPair, onChooseDifferentPair, onStartDemo, onStartPractice, onComplete, onPlayReveal }) {
  const [step, setStep] = useState(initialStep);
  const [done, setDone] = useState(false);
  const [typed, setTyped] = useState(false);
  const [customA, setCustomA] = useState("");
  const [customB, setCustomB] = useState("");
  const [chosenPair, setChosenPair] = useState(null);
  const [guess, setGuess] = useState(null);

  useEffect(() => {
    if (done && onComplete) onComplete();
  }, [done, onComplete]);

  // If the student replays the division while we're on the reflection step,
  // reset typing so the button doesn't appear early.
  useEffect(() => {
    if ((step === 4 || step === 6) && !divisionDone) setTyped(false);
  }, [step, divisionDone]);

  if (done) {
    return (
      <div style={styles.tutorialDone}>
        <TeacherBubble text={`Great job! Now explore on your own — try any numbers you like! 🎉`} />
        <button style={styles.smallBtn} onClick={() => {
          if (onTryAgain) return onTryAgain();
          setStep(1);
          setDone(false);
          setTyped(false);
          setChosenPair(null);
          setCustomA("");
          setCustomB("");
          setGuess(null);
        }}>
          ↺ Try again
        </button>
      </div>
    );
  }

  // Step 0: Greeting
  if (step === 0) {
    return (
      <div style={styles.tutorialCard}>
        <TeacherBubble
          text="Hi! I'm Professor Sandbox. Let's break apart some numbers together!"
          onDone={() => setTyped(true)}
        />
        {typed && (
          <div style={styles.tutorialActions}>
            <button style={styles.bigBtn} onClick={() => { setStep(1); setTyped(false); }}>
              Let's go! →
            </button>
            <button style={styles.skipBtn} onClick={() => setDone(true)}>Skip tutorial</button>
          </div>
        )}
      </div>
    );
  }

  // Step 1: Pick a pair
  if (step === 1) {
    const pairs = [
      { a: 55, b: 34, label: "55 and 34", note: "Fibonacci friends!" },
      { a: 17, b: 12, label: "17 and 12", note: "Close to √2" },
      { a: 30, b: 11, label: "30 and 11", note: "My favorite!" },
    ];
    return (
      <div style={styles.tutorialCard}>
        <TeacherBubble
          text="First, pick two numbers. Which pair should we try?"
          onDone={() => setTyped(true)}
        />
        {typed && (
          <div style={styles.tutorialOptions}>
            {pairs.map(p => (
              <button key={p.label} style={{
                ...styles.tutorialOption,
                ...(chosenPair === p.label ? styles.tutorialOptionActive : {}),
              }} onClick={() => {
                setChosenPair(p.label);
                onPickPair(p.a, p.b);
              }}>
                <div style={{ fontSize: 18, fontWeight: 800 }}>{p.label}</div>
                <div style={{ fontSize: 11, color: COLORS.textLight }}>{p.note}</div>
              </button>
            ))}
            <div style={styles.tutorialOrDivider}>— or type your own! —</div>
            <div style={{ display: "flex", gap: 8, alignItems: "center", justifyContent: "center" }}>
              <input style={styles.numInput} placeholder="big" value={customA}
                onChange={e => setCustomA(e.target.value)} />
              <span style={{ fontWeight: 700 }}>and</span>
              <input style={styles.numInput} placeholder="smaller" value={customB}
                onChange={e => setCustomB(e.target.value)} />
              <button style={styles.goBtn} onClick={() => {
                const na = parseInt(customA), nb = parseInt(customB);
                if (na > 1 && nb > 0 && na > nb && na <= 500) {
                  setChosenPair(`${na} and ${nb}`);
                  onPickPair(na, nb);
                }
              }}>Pick!</button>
            </div>
          </div>
        )}
        {chosenPair && (
          <div style={styles.tutorialActions}>
            <button style={styles.bigBtn} onClick={() => { setStep(3); setTyped(false); }}>
              Great choice! →
            </button>
          </div>
        )}
      </div>
    );
  }

  // Step 2 (prediction) removed — not appropriate before students know what RRS is.
  // The prediction prompt now lives in the post-tutorial "new pair" flow.

  // Step 3: Professor demo first
  if (step === 3) {
    return (
      <div style={{ ...styles.tutorialCard, ...styles.tutorialHighlight }}>
        <TeacherBubble
          text={`Nice, ${chosenPair}! First, watch me do one full RRS example. We'll walk through the division steps together, and then it'll be your turn.`}
          onDone={() => setTyped(true)}
        />
        {typed && (
          <div style={styles.tutorialActions}>
            <button style={{ ...styles.bigBtn, animation: "pulse 1.5s infinite" }} onClick={() => {
              if (onPlayReveal) onPlayReveal(); // reveal practice UI
              if (onStartDemo) onStartDemo();
              setStep(4); // wait for the professor demo to finish
              setTyped(false);
            }}>
              ▶ Watch the tutorial first!
            </button>
          </div>
        )}
      </div>
    );
  }

  // Step 4: Reflect after professor demo
  if (step === 4) {
    if (!divisionDone) return null; // wait until the demo has fully finished
    return (
      <div style={styles.tutorialCard}>
        <TeacherBubble
          text="See all those division steps? Each one is a chunk of the RRS recipe. When the remainder becomes 0, the division is finished. Now you know the pattern!"
          onDone={() => setTyped(true)}
        />
        {typed && (
          <div style={styles.tutorialActions}>
            <button style={styles.bigBtn} onClick={() => { setStep(5); setTyped(false); }}>
              My turn! →
            </button>
          </div>
        )}
      </div>
    );
  }

  // Step 5: Student practice intro
  if (step === 5) {
    return (
      <div style={{ ...styles.tutorialCard, ...styles.tutorialHighlight }}>
        <TeacherBubble
          text={`Now it's your turn! Fill in each division step yourself: a ÷ b = q remainder r. Each correct answer will reveal the next rectangle change.`}
          onDone={() => setTyped(true)}
        />
        {typed && (
          <div style={styles.tutorialActions}>
            <button style={{ ...styles.bigBtn, animation: "pulse 1.5s infinite" }} onClick={() => {
              if (onPlayReveal) onPlayReveal();
              if (onStartPractice) onStartPractice();
              setStep(6);
              setTyped(false);
            }}>
              ▶ Start your practice!
            </button>
            <button style={styles.skipBtn} onClick={() => {
              if (onChooseDifferentPair) onChooseDifferentPair();
              else {
                setChosenPair(null);
                setTyped(false);
                setStep(1);
              }
            }}>
              Pick different numbers
            </button>
          </div>
        )}
      </div>
    );
  }

  // Step 6: Reflect after student practice
  if (step === 6) {
    if (!divisionDone) return null; // wait until the student practice is done
    return (
      <div style={styles.tutorialCard}>
        <TeacherBubble
          text="Beautiful work! You solved each division step yourself and watched the rectangle grow step by step. Now you're ready to explore on your own!"
          onDone={() => setTyped(true)}
        />
        {typed && (
          <div style={styles.tutorialActions}>
            <button style={styles.bigBtn} onClick={() => setDone(true)}>Got it! ✓</button>
          </div>
        )}
      </div>
    );
  }

  return null;
}

function GCFTutorial({ presets, gcfValue, onPickPair, onListFactors, onHighlightCommon, onRevealGCF, onShowRRS }) {
  const [step, setStep] = useState(0);
  const [done, setDone] = useState(false);
  const [typed, setTyped] = useState(false);
  const [chosenPair, setChosenPair] = useState(null);

  useEffect(() => {
    setTyped(false);
  }, [step]);

  if (done) {
    return (
      <div style={styles.tutorialDone}>
        <TeacherBubble text={`Nice work! You found the GCF in two ways, and now you know what it means geometrically too. 🎉`} />
        <div style={styles.tutorialActions}>
          <button style={styles.smallBtn} onClick={() => {
            setStep(1);
            setDone(false);
            setTyped(false);
            setChosenPair(null);
          }}>
            ↺ Try another pair
          </button>
        </div>
      </div>
    );
  }

  if (step === 0) {
    return (
      <div style={styles.tutorialCard}>
        <TeacherBubble
          text="How do we find a Greatest Common Factor? You may know the factor-list way: list all factors and find the biggest match. But the RRS rectangle gives a geometric meaning too. The smallest square is not just the end of the picture — its side length tells us the GCF."
          onDone={() => setTyped(true)}
        />
        {typed && (
          <div style={styles.tutorialActions}>
            <div style={styles.gcfTutorHint}>
              💡 Compare the factor method with the rectangle method and see how they meet at the smallest square.
            </div>
            <button style={styles.bigBtn} onClick={() => setStep(1)}>Let's start! →</button>
          </div>
        )}
      </div>
    );
  }

  if (step === 1) {
    return (
      <div style={styles.tutorialCard}>
        <TeacherBubble
          text="First, pick a pair of numbers. We will use them in both methods so you can compare the answers."
          onDone={() => setTyped(true)}
        />
        {typed && (
          <div style={styles.tutorialOptions}>
            {presets.map(p => (
              <button
                key={p.label}
                style={{
                  ...styles.tutorialOption,
                  ...(chosenPair === p.label ? styles.tutorialOptionActive : {}),
                }}
                onClick={() => {
                  setChosenPair(p.label);
                  onPickPair(p.a, p.b);
                }}
              >
                <div style={{ fontSize: 18, fontWeight: 800 }}>{p.label}</div>
                <div style={{ fontSize: 11, color: COLORS.textLight }}>GCF lesson pair</div>
              </button>
            ))}
          </div>
        )}
        {chosenPair && (
          <div style={styles.tutorialActions}>
            <button style={styles.bigBtn} onClick={() => setStep(2)}>Great choice! →</button>
          </div>
        )}
      </div>
    );
  }

  if (step === 2) {
    return (
      <div style={{ ...styles.tutorialCard, ...styles.tutorialHighlight }}>
        <TeacherBubble
          text="Let's begin with the traditional method. First we reveal all the factors for both numbers."
          onDone={() => setTyped(true)}
        />
        {typed && (
          <div style={styles.tutorialActions}>
            <button style={{ ...styles.bigBtn, animation: "pulse 1.5s infinite" }} onClick={() => {
              onListFactors();
              setStep(3);
            }}>
              1. List Factors
            </button>
          </div>
        )}
      </div>
    );
  }

  if (step === 3) {
    return (
      <div style={styles.tutorialCard}>
        <TeacherBubble
          text="Now highlight the factors both lists share. These are the common factors."
          onDone={() => setTyped(true)}
        />
        {typed && (
          <div style={styles.tutorialActions}>
            <button style={{ ...styles.bigBtn, animation: "pulse 1.5s infinite" }} onClick={() => {
              onHighlightCommon();
              setStep(4);
            }}>
              2. Highlight Common Factors
            </button>
          </div>
        )}
      </div>
    );
  }

  if (step === 4) {
    return (
      <div style={styles.tutorialCard}>
        <TeacherBubble
          text="Among the common factors, one is the greatest. Let's reveal it."
          onDone={() => setTyped(true)}
        />
        {typed && (
          <div style={styles.tutorialActions}>
            <button style={{ ...styles.bigBtn, animation: "pulse 1.5s infinite" }} onClick={() => {
              onRevealGCF();
              setStep(5);
            }}>
              3. Reveal GCF
            </button>
          </div>
        )}
      </div>
    );
  }

  if (step === 5) {
    return (
      <div style={styles.tutorialCard}>
        <TeacherBubble
          text={`Beautiful. The traditional method says the GCF is ${gcfValue}. Now slide to the RRS picture and see that same number appear as a square side length.`}
          onDone={() => setTyped(true)}
        />
        {typed && (
          <div style={styles.tutorialActions}>
            <button style={{ ...styles.bigBtn, animation: "pulse 1.5s infinite" }} onClick={() => {
              onShowRRS();
              setStep(6);
            }}>
              Slide to RRS →
            </button>
          </div>
        )}
      </div>
    );
  }

  if (step === 6) {
    return (
      <div style={styles.tutorialCard}>
        <TeacherBubble
          text={`At the end of the rectangle process, the smallest square has side length ${gcfValue}. So the GCF is not just a number on a list — it is a length that fits both starting sides exactly.`}
          onDone={() => setTyped(true)}
        />
        {typed && (
          <div style={styles.tutorialActions}>
            <button style={styles.bigBtn} onClick={() => setDone(true)}>I see it! ✓</button>
          </div>
        )}
      </div>
    );
  }

  return null;
}

function BackwardRRSTutorial({ presets, onLoadPreset }) {
  const [step, setStep] = useState(0);
  const [typed, setTyped] = useState(false);
  const [chosenPreset, setChosenPreset] = useState(null);

  useEffect(() => {
    setTyped(false);
  }, [step]);

  if (step === 0) {
    return (
      <div style={styles.tutorialCard}>
        <TeacherBubble
          text="What if we do RRS backwards? Instead of starting with one big rectangle and breaking it apart, we can start with the smallest square and build the rectangle back up. Each stage chooses how many same-size squares to place, so the reverse build foreshadows both the forward recipe and the final rectangle."
          onDone={() => setTyped(true)}
        />
        {typed && (
          <div style={styles.tutorialActions}>
            <div style={styles.gcfTutorHint}>
              💡 Start with the seed square, adjust the stage counts, and watch how each choice creates the next square size automatically.
            </div>
            <button style={styles.bigBtn} onClick={() => setStep(1)}>Let's build! →</button>
          </div>
        )}
      </div>
    );
  }

  if (step === 1) {
    return (
      <div style={styles.tutorialCard}>
        <TeacherBubble
          text="Pick a starting build. The Sketch Example is a good first one because you can clearly see the rectangle grow one layer at a time."
          onDone={() => setTyped(true)}
        />
        {typed && (
          <div style={styles.tutorialOptions}>
            {presets.map(preset => (
              <button
                key={preset.label}
                style={{
                  ...styles.tutorialOption,
                  ...(chosenPreset === preset.label ? styles.tutorialOptionActive : {}),
                }}

                  setChosenPreset(preset.label);
                  onLoadPreset(preset);

              >
                <div style={{ fontSize: 18, fontWeight: 800 }}>{preset.label}</div>
                <div style={{ fontSize: 11, color: COLORS.textLight }}>
                  start {preset.smallest} × {preset.smallest}
                </div>
              </button>
            ))}
          </div>
        )}
        {chosenPreset && (
          <div style={styles.tutorialActions}>
            <button style={styles.bigBtn} onClick={() => setStep(2)}>Great choice! →</button>

/* ─────────────── TAB 1: RRS MACHINE ─────────────── */
function TabRRS() {
  const [a, setA] = useState(55);
  const [b, setB] = useState(34);
  const [inputA, setInputA] = useState("55");
  const [inputB, setInputB] = useState("34");
  const [currentStep, setCurrentStep] = useState(-1);
  const [autoPlay, setAutoPlay] = useState(false);
  const [tutorialComplete, setTutorialComplete] = useState(false);
  const [showPlayView, setShowPlayView] = useState(false);
  const [predictionGuess, setPredictionGuess] = useState(null);
  const [showPrediction, setShowPrediction] = useState(false);
  const [tutorialKey, setTutorialKey] = useState(0);
  const [tutorialStartStep, setTutorialStartStep] = useState(0);
  const [practiceMode, setPracticeMode] = useState(false);
  const [practiceIdx, setPracticeIdx] = useState(0);
  const [practiceReveal, setPracticeReveal] = useState(-2); // -2 means show no squares yet
  const [practiceQ, setPracticeQ] = useState("");
  const [practiceR, setPracticeR] = useState("");
  const [practiceChecked, setPracticeChecked] = useState(null); // null | true | false
  // Q&A state (appears after animation finishes)
  const [stepAnswer, setStepAnswer] = useState("");
  const [stepCorrect, setStepCorrect] = useState(null);
  const [sqAnswer, setSqAnswer] = useState("");
  const [sqCorrect, setSqCorrect] = useState(null);
  const [showSeqIntro, setShowSeqIntro] = useState(false);
  const timerRef = useRef(null);

  // Reset Q&A whenever a/b changes
  useEffect(() => {
    setStepAnswer(""); setStepCorrect(null);
    setSqAnswer(""); setSqCorrect(null);
    setShowSeqIntro(false);
    setPracticeMode(false);
    setPracticeIdx(0);
    setPracticeReveal(-2);
    setPracticeQ(""); setPracticeR(""); setPracticeChecked(null);
  }, [a, b]);

  // Helper: when student picks a NEW pair after tutorial, ask for prediction
  const pickNewPair = (newA, newB) => {
    setA(newA); setB(newB);
    setInputA(String(newA)); setInputB(String(newB));
    setCurrentStep(-1); setAutoPlay(false);
    setPracticeMode(false);
    setPracticeIdx(0);
    setPracticeReveal(-2);
    setPracticeQ(""); setPracticeR(""); setPracticeChecked(null);
    if (tutorialComplete) {
      setPredictionGuess(null);
      setShowPrediction(true);
    }
  };

  const steps = useMemo(() => euclideanSteps(a, b), [a, b]);
  const totalSquares = useMemo(() => steps.reduce((s, st) => s + st.q, 0), [steps]);

  const resetToPick = useCallback(() => {
    if (timerRef.current) clearTimeout(timerRef.current);
    setA(55); setB(34);
    setInputA("55"); setInputB("34");
    setCurrentStep(-1);
    setAutoPlay(false);
    setTutorialComplete(false);
    setShowPlayView(false);
    setPredictionGuess(null);
    setShowPrediction(false);
    setStepAnswer(""); setStepCorrect(null);
    setSqAnswer(""); setSqCorrect(null);
    setShowSeqIntro(false);
    setPracticeMode(false);
    setPracticeIdx(0);
    setPracticeReveal(-2);
    setPracticeQ(""); setPracticeR(""); setPracticeChecked(null);
    setTutorialStartStep(1);
    setTutorialKey(k => k + 1); // remount tutorial so it returns to the number-pick page
  }, []);

  const startDemo = useCallback(() => {
    if (timerRef.current) clearTimeout(timerRef.current);
    setPracticeMode(false);
    setPracticeIdx(0);
    setPracticeReveal(-2);
    setPracticeQ(""); setPracticeR(""); setPracticeChecked(null);
    setCurrentStep(0);
    setAutoPlay(true);
    setStepAnswer(""); setStepCorrect(null);
    setSqAnswer(""); setSqCorrect(null);
    setShowSeqIntro(false);
  }, []);

  const reopenTutorialPairPicker = useCallback(() => {
    if (timerRef.current) clearTimeout(timerRef.current);
    setCurrentStep(-1);
    setAutoPlay(false);
    setShowPlayView(false);
    setPracticeMode(false);
    setPracticeIdx(0);
    setPracticeReveal(-2);
    setPracticeQ(""); setPracticeR(""); setPracticeChecked(null);
    setStepAnswer(""); setStepCorrect(null);
    setSqAnswer(""); setSqCorrect(null);
    setShowSeqIntro(false);
    setTutorialStartStep(1);
    setTutorialKey(k => k + 1);
  }, []);

  const startPractice = useCallback(() => {
    if (timerRef.current) clearTimeout(timerRef.current);
    setAutoPlay(false);
    setPracticeMode(true);
    setPracticeIdx(0);
    setPracticeReveal(-2);
    setPracticeQ(""); setPracticeR(""); setPracticeChecked(null);
    setCurrentStep(-1);
  }, []);

  const practiceDone = useMemo(() => practiceMode && practiceReveal >= steps.length - 1, [practiceMode, practiceReveal, steps.length]);
  const divisionDone = useMemo(() => practiceMode ? practiceDone : (currentStep >= steps.length - 1 && currentStep !== -1), [practiceMode, practiceDone, currentStep, steps.length]);
  const vizStep = practiceMode ? practiceReveal : currentStep;

  const practiceCheck = useCallback(() => {
    const step = steps[practiceIdx];
    if (!step) return;
    const q = parseInt(practiceQ, 10);
    const r = parseInt(practiceR, 10);
    const ok = Number.isFinite(q) && Number.isFinite(r) && q === step.q && r === step.r;
    setPracticeChecked(ok);
    if (ok) setPracticeReveal(practiceIdx);
  }, [steps, practiceIdx, practiceQ, practiceR]);

  const practiceNext = useCallback(() => {
    if (practiceChecked !== true) return;
    if (practiceIdx >= steps.length - 1) return;
    setPracticeIdx(i => Math.min(steps.length - 1, i + 1));
    setPracticeQ(""); setPracticeR(""); setPracticeChecked(null);
  }, [practiceChecked, practiceIdx, steps.length]);

  const apply = useCallback(() => {
    const na = parseInt(inputA), nb = parseInt(inputB);
    if (na > 1 && nb > 0 && na > nb && na <= 500) {
      pickNewPair(na, nb);
    }
  }, [inputA, inputB, tutorialComplete]);

  useEffect(() => {
    if (practiceMode) return;
    if (autoPlay && currentStep < steps.length - 1) {
      timerRef.current = setTimeout(() => setCurrentStep(s => s + 1), 1800);
      return () => clearTimeout(timerRef.current);
    }
    if (currentStep >= steps.length - 1) setAutoPlay(false);
  }, [practiceMode, autoPlay, currentStep, steps.length]);

  const visibleSteps = useMemo(() => {
    if (practiceMode) return steps.slice(0, Math.min(steps.length, practiceIdx + 1));
    return currentStep === -1 ? steps : steps.slice(0, currentStep + 1);
  }, [practiceMode, steps, currentStep, practiceIdx]);
  const presets = [
    { a: 55, b: 34, label: "55 & 34" }, { a: 17, b: 12, label: "17 & 12" },
    { a: 30, b: 11, label: "30 & 11" }, { a: 76, b: 47, label: "76 & 47" },
    { a: 97, b: 60, label: "97 & 60" },
  ];

  return (
    <div>
      <div style={styles.sectionIntro}>
        <div style={styles.sectionKicker}>Layer 1 · Finite RRS</div>
        <h2 style={styles.sectionTitle}>RRS Machine</h2>
        <p style={styles.sectionDesc}>
          Start with two numbers and split one rectangle into squares, one step at a time.
          This layer shows one process in three views: division steps, squares in a rectangle, and an RRS recipe.
        </p>
      </div>
      <RRSTutorial
        key={tutorialKey}
        initialStep={tutorialStartStep}
        divisionDone={divisionDone}
        onTryAgain={resetToPick}
        onPickPair={(pa, pb) => {
          setA(pa); setB(pb);
          setInputA(String(pa)); setInputB(String(pb));
          setCurrentStep(-1); setAutoPlay(false);
          setPracticeMode(false);
          setPracticeIdx(0);
          setPracticeReveal(-2);
          setPracticeQ(""); setPracticeR(""); setPracticeChecked(null);
        }}
        onChooseDifferentPair={reopenTutorialPairPicker}
        onStartDemo={startDemo}
        onStartPractice={startPractice}
        onPlayReveal={() => setShowPlayView(true)}
        onComplete={() => {
          setTutorialComplete(true);
          setShowPlayView(true);
          setPracticeMode(false);
          setPracticeIdx(0);
          setPracticeReveal(-2);
          setPracticeQ(""); setPracticeR(""); setPracticeChecked(null);
        }}
      />

      {/* TIER 1: Visible during Press Play demo (3-column layout) */}
      {showPlayView && (
        <div className="three-col" style={styles.threeCol}>
          {/* LEFT: Division Steps */}
          <div style={styles.stepsCard}>
            <h3 style={styles.cardTitle}>Division Steps</h3>
            {visibleSteps.map((s, i) => (
              <div key={i} style={{
                ...styles.stepRow,
                background: i === (practiceMode ? practiceIdx : currentStep) ? "#FFF0E5" : "transparent",
                transition: "all 0.8s ease",
              }}>
                <span style={{ ...styles.stepDot, background: SQUARE_COLORS[i % 8] }} />
                <span style={styles.stepText}>
                  <b style={{ color: COLORS.primary }}>Step {i + 1}:</b>{" "}
                  {s.a} ÷ {s.b} ={" "}
                  <span style={{ color: COLORS.primary, fontWeight: 800, fontSize: 18 }}>
                    {practiceMode && i > practiceReveal ? "?" : s.q}
                  </span>{" "}
                  R{" "}
                  <span style={{ color: COLORS.purple, fontWeight: 700 }}>
                    {practiceMode && i > practiceReveal ? "?" : s.r}
                  </span>
                </span>
              </div>
            ))}
            <div style={{ marginTop: 12, display: "flex", gap: 6, flexWrap: "wrap" }}>
              <button style={styles.smallBtn} onClick={() => {
                if (practiceMode) {
                  setPracticeIdx(0);
                  setPracticeReveal(-2);
                  setPracticeQ(""); setPracticeR(""); setPracticeChecked(null);
                } else {
                  setCurrentStep(0); setAutoPlay(true);
                  setStepAnswer(""); setStepCorrect(null);
                  setSqAnswer(""); setSqCorrect(null);
                  setShowSeqIntro(false);
                }
              }}>↺ Replay</button>
              <button style={styles.smallBtn} onClick={resetToPick}>↩ Try again</button>
            </div>
          </div>

          {/* MIDDLE: Rectangle Picture */}
          <div style={styles.rssVizCard}>
            <div style={styles.rssVizHeader}>
              <h3 style={styles.cardTitle}>Rectangle Picture</h3>
              <div style={styles.rssVizStat}>
                {practiceMode ? (practiceDone ? "Finished" : `Working on Step ${practiceIdx + 1}`) : (currentStep === -1 ? "Full recipe" : `Step ${currentStep + 1}`)}
              </div>
            </div>
            <div style={styles.vizCenter}>
              <RectViz
                a={a}
                b={b}
                visibleGroup={vizStep}
                activeGroup={practiceMode ? (practiceReveal >= 0 ? practiceReveal : null) : (currentStep >= 0 ? currentStep : null)}
                showControls={false}
                hideFooter={!tutorialComplete}
              />
            </div>
          </div>

          {/* RIGHT: Q&A panel */}
          <div style={styles.qaCard}>
            <h3 style={styles.cardTitle}>Your Turn!</h3>
            {practiceMode ? (
              <>
                {!practiceDone ? (
                  <div style={styles.qaQuestion}>
                    <div style={styles.qaTeacher}>
                      <span style={{ fontSize: 20 }}>🧑‍🏫</span>
                      <span>
                        Fill in Step <b>{practiceIdx + 1}</b>:{" "}
                        <b>{steps[practiceIdx]?.a}</b> ÷ <b>{steps[practiceIdx]?.b}</b> = q R r
                      </span>
                    </div>
                    <div style={styles.qaInputRow}>
                      <input
                        style={styles.numInput}
                        value={practiceQ}
                        onChange={e => { setPracticeQ(e.target.value); setPracticeChecked(null); }}
                        onKeyDown={e => e.key === "Enter" && practiceCheck()}
                        placeholder="q"
                      />
                      <span style={{ color: COLORS.textLight, fontWeight: 800 }}>R</span>
                      <input
                        style={styles.numInput}
                        value={practiceR}
                        onChange={e => { setPracticeR(e.target.value); setPracticeChecked(null); }}
                        onKeyDown={e => e.key === "Enter" && practiceCheck()}
                        placeholder="r"
                      />
                      <button style={styles.goBtn} onClick={practiceCheck}>Check</button>
                    </div>
                    {practiceChecked === true && (
                      <div style={styles.qaCorrect}>
                        ✨ Correct! The rectangle updated. {practiceIdx < steps.length - 1 ? "Click Next Step." : "You reached remainder 0!"}
                      </div>
                    )}
                    {practiceChecked === false && <div style={styles.qaWrong}>Not quite. Try again.</div>}
                    <div style={{ marginTop: 10, display: "flex", gap: 8, justifyContent: "flex-end" }}>
                      <button
                        style={styles.smallBtn}
                        onClick={reopenTutorialPairPicker}
                      >
                        Pick different numbers
                      </button>
                      <button
                        style={{ ...styles.playBtn, opacity: practiceChecked === true ? 1 : 0.5, cursor: practiceChecked === true ? "pointer" : "not-allowed" }}
                        onClick={practiceNext}
                        disabled={practiceChecked !== true || practiceIdx >= steps.length - 1}
                      >
                        Next Step →
                      </button>
                    </div>
                  </div>
                ) : (
                  <div style={styles.qaWaiting}>
                    <span style={{ fontSize: 32 }}>🎉</span>
                    <p style={{ fontSize: 13, color: COLORS.textLight, marginTop: 8 }}>
                      Division finished. Look for the teacher message above.
                    </p>
                  </div>
                )}
              </>
            ) : (currentStep >= steps.length - 1 ? (
              <>
                {/* Question 1: Number of steps */}
                <div style={styles.qaQuestion}>
                  <div style={styles.qaTeacher}>
                    <span style={{ fontSize: 20 }}>🧑‍🏫</span>
                    <span>How many <b>steps</b> did that take?</span>
                  </div>
                  <div style={styles.qaInputRow}>
                    <input style={styles.numInput} value={stepAnswer}
                      onChange={e => { setStepAnswer(e.target.value); setStepCorrect(null); }}
                      placeholder="?" />
                    <button style={styles.goBtn} onClick={() => {
                      setStepCorrect(parseInt(stepAnswer) === steps.length);
                    }}>Check</button>
                  </div>
                  {stepCorrect === true && <div style={styles.qaCorrect}>✨ Correct! {steps.length} steps.</div>}
                  {stepCorrect === false && <div style={styles.qaWrong}>Not quite — count the rows on the left!</div>}
                </div>

                {/* Question 2: Total squares */}
                {stepCorrect && (
                  <div style={styles.qaQuestion}>
                    <div style={styles.qaTeacher}>
                      <span style={{ fontSize: 20 }}>🧑‍🏫</span>
                      <span>Now count the <b>total squares</b> in the rectangle!</span>
                    </div>
                    <div style={styles.qaInputRow}>
                      <input style={styles.numInput} value={sqAnswer}
                        onChange={e => { setSqAnswer(e.target.value); setSqCorrect(null); }}
                        placeholder="?" />
                      <button style={styles.goBtn} onClick={() => {
                        setSqCorrect(parseInt(sqAnswer) === totalSquares);
                      }}>Check</button>
                    </div>
                    {sqCorrect === true && <div style={styles.qaCorrect}>🎉 Yes! {totalSquares} squares total.</div>}
                    {sqCorrect === false && <div style={styles.qaWrong}>Hmm, count each colored square in the picture.</div>}
                  </div>
                )}

                {/* Step 3: Define RRS sequence */}
                {sqCorrect && !showSeqIntro && (
                  <div style={styles.qaQuestion}>
                    <button style={styles.bigBtn} onClick={() => setShowSeqIntro(true)}>
                      Next: What's an RRS sequence? →
                    </button>
                  </div>
                )}
                {showSeqIntro && (
                  <div style={styles.seqReveal}>
                    <div style={styles.qaTeacher}>
                      <span style={{ fontSize: 20 }}>🧑‍🏫</span>
                      <span>Now let's define the <b>RRS sequence</b>!</span>
                    </div>
                    <div style={styles.seqBox}>
                      <div style={{ fontSize: 13, color: COLORS.textLight, marginBottom: 6 }}>
                        The quotients from each step:
                      </div>
                      <div style={styles.quotientRow}>
                        {steps.map((s, i) => (
                          <span key={i} style={{ ...styles.quotientBubble, background: SQUARE_COLORS[i % 8] }}>{s.q}</span>
                        ))}
                      </div>
                    <div style={styles.seqFormula}>
                        {a}/{b} = {formatRRSRecipe(steps.map(s => s.q))}
                    </div>
                  </div>
                  {!tutorialComplete && (
                    <button style={{ ...styles.bigBtn, marginTop: 12 }} onClick={() => setTutorialComplete(true)}>
                      Got it! Let's try more ✓
                      </button>
                    )}
                  </div>
                )}
              </>
            ) : (
              <div style={styles.qaWaiting}>
                <span style={{ fontSize: 32 }}>⏳</span>
                <p style={{ fontSize: 13, color: COLORS.textLight, marginTop: 8 }}>
                  Watch the animation... questions appear when it finishes!
                </p>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* TIER 2: Full controls + try-another — only after tutorial complete */}
      {tutorialComplete && (<>
      <div style={styles.controlRow}>
        <div style={styles.presetRow}>
          {presets.map(p => (
            <button key={p.label} onClick={() => pickNewPair(p.a, p.b)}
              style={{ ...styles.presetBtn, ...(a === p.a && b === p.b ? styles.presetActive : {}) }}>
              {p.label}
            </button>
          ))}
        </div>
        <div style={styles.inputGroup}>
          <span style={styles.inputLabel}>Custom:</span>
          <input style={styles.numInput} value={inputA} onChange={e => setInputA(e.target.value)} onKeyDown={e => e.key === "Enter" && apply()} />
          <span style={{ color: COLORS.textLight, fontWeight: 700 }}>÷</span>

/* ─────────────── TAB 3: SQRT EXPLORER ─────────────── */
function TabSqrt() {
  const [r, setR] = useState(2);
  const [guidedStep, setGuidedStep] = useState(0);

  const cf = useMemo(() => sqrtCF(r, 20), [r]);
  const sqrtApprox = useMemo(() => cf.convergents.slice(1, 7), [cf]);
  const isqrt = Math.floor(Math.sqrt(r));
  const isPerfect = isqrt * isqrt === r;
  const sqrtValue = Math.sqrt(r);

  const guidedSteps2 = [
    { title: "Start with √2", content: `We know √2 is between 1 and 2 (since 1² = 1 and 2² = 4).\nSo the integer part is 1. Write: √2 = 1 + (√2 − 1)` },
    { title: "Flip the fractional part", content: `Take the leftover (√2 − 1) and flip it:\n1/(√2 − 1)\n\nMultiply top and bottom by (√2 + 1):\n= (√2 + 1) / ((√2)² − 1²)\n= (√2 + 1) / (2 − 1)\n= √2 + 1` },
    { title: "Find integer part again", content: `√2 + 1 ≈ 2.414...\nInteger part = 2. Leftover = √2 + 1 − 2 = √2 − 1\n\n...wait, that's the SAME leftover as Step 1!` },
    { title: "It repeats forever!", content: `Since we got √2 − 1 again, the process loops:\n\n√2 = 1 + 1/(2 + 1/(2 + 1/(2 + ...)))\n\nRRS Recipe: [1; 2, 2, 2, 2, ...]\nThe 2 repeats forever! ♾️` },
  ];

  const guidedSteps17 = [
    { title: "Start with √17", content: `√17 is between 4 and 5 (since 4² = 16 and 5² = 25).\nInteger part = 4. Write: √17 = 4 + (√17 − 4)` },
    { title: "Flip and rationalize", content: `1/(√17 − 4) × (√17 + 4)/(√17 + 4)\n= (√17 + 4)/(17 − 16)\n= √17 + 4\n\nSo: √17 = 4 + 1/(√17 + 4)` },
    { title: "Self-substitution!", content: `Since √17 appears on both sides:\n√17 = 4 + 1/(4 + √17)\n     = 4 + 1/(4 + 4 + 1/(4 + √17))\n     = 4 + 1/(8 + 1/(4 + √17))` },
    { title: "The repeating pattern", content: `Keep going and the pattern emerges:\n\n√17 = [4; 8, 8, 8, 8, ...]\n     = [4; (8)]\n\nThe 8 repeats forever!\nNotice: 8 = 2 × 4 = 2 × a₀. This always happens!` },
  ];

  const guidedSteps = r === 2 ? guidedSteps2 : r === 17 ? guidedSteps17 : null;

  const sqrtPresets = [2, 3, 5, 7, 10, 13, 17, 19];
  const returnForm = r === 2 ? "√2 − 1" : r === 17 ? "√17 − 4" : "the same irrational state";

  return (
    <div>
      <SqrtTutorial
        onStartGuided={(nextR) => {
          setR(nextR);
          setGuidedStep(0);
        }}
      />

      <div style={styles.sqrtControls}>
        <span style={styles.inputLabel}>Pick a number:</span>
        <div style={styles.presetRow}>
          {sqrtPresets.map(n => (
            <button key={n} onClick={() => { setR(n); setGuidedStep(0); }}
              style={{ ...styles.presetBtn, ...(r === n ? styles.presetActive : {}) }}>
              √{n}
            </button>
          ))}
        </div>
      </div>

      {isPerfect ? (
        <div style={styles.perfectSquareMsg}>
          ✅ {r} is a perfect square! √{r} = {isqrt}. No continued fraction needed — it's already a whole number!
        </div>
      ) : (
        <>
          {guidedSteps && (
            <div style={styles.guidedContainer}>
              <div style={styles.guidedProgress}>
                {guidedSteps.map((_, i) => (

                </h3>

              </div>
              <div style={{ display: "flex", gap: 10, justifyContent: "center" }}>
                <button style={styles.playBtn} disabled={guidedStep === 0}
                  onClick={() => setGuidedStep(s => s - 1)}>← Back</button>
                <button style={styles.playBtn} disabled={guidedStep === guidedSteps.length - 1}
                  onClick={() => setGuidedStep(s => s + 1)}>Next →</button>
              </div>
            </div>
          )}

          <div style={styles.explorerGrid}>
            <div style={styles.explorerCard}>
              <h3 style={styles.cardTitle}>Recipe Snapshot</h3>
              <div style={styles.cfResult}>
                <div style={styles.cfLabel}>Continued Fraction / RRS Recipe:</div>
                <code style={styles.cfCode}>
                  [{cf.a0}; ({cf.period.join(", ")})]
                </code>
              </div>
              <div style={styles.cfResult}>
                <div style={styles.cfLabel}>Starts with:</div>
                <b style={{ color: COLORS.primary, fontSize: 18 }}>a₀ = {cf.a0}</b>
              </div>
              <div style={styles.cfResult}>
                <div style={styles.cfLabel}>Period length:</div>

              </div>
              <div style={styles.cfResult}>

              <div style={styles.cfResult}>

            <div style={styles.explorerCard}>

function RectViz({ a, b, label, compact = false, visibleGroup = null, activeGroup = null, showControls = !compact, hideFooter = false }) {
  const steps = useMemo(() => euclideanSteps(a, b), [a, b]);
  const squares = useMemo(() => buildSquares(a, b, steps), [a, b, steps]);
  const [hoveredGroup, setHoveredGroup] = useState(null);
  const [animStep, setAnimStep] = useState(-1);
  const [animating, setAnimating] = useState(false);

  useEffect(() => {
    if (animating && animStep < squares.length - 1) {
      const timer = setTimeout(() => setAnimStep(s => s + 1), 800);
      return () => clearTimeout(timer);
    }
    if (animStep >= squares.length - 1) setAnimating(false);
  }, [animating, animStep, squares.length]);

  const padding = compact ? 20 : 32;
  const maxW = compact ? 260 : 480;
  const maxH = compact ? 180 : 340;
  const scale = Math.min(maxW / a, maxH / b);
  const svgW = a * scale + padding * 2;
  const svgH = b * scale + padding * 2;
  const focusedGroup = hoveredGroup !== null ? hoveredGroup : activeGroup;

  return (
    <div style={{ textAlign: "center" }}>
      {label && <div style={styles.vizLabel}>{label}</div>}
      {showControls && !compact && (
        <div style={{ marginBottom: 8, display: "flex", gap: 8, justifyContent: "center" }}>
          <button style={styles.smallBtn} onClick={() => { setAnimStep(-1); setAnimating(false); }}>Show All</button>
          <button style={styles.smallBtn} onClick={() => { setAnimStep(0); setAnimating(true); }}>▶ Animate</button>
        </div>
      )}
      <svg width={svgW} height={svgH} viewBox={`0 0 ${svgW} ${svgH}`}>
        <rect x={padding - 1} y={padding - 1} width={a * scale + 2} height={b * scale + 2}
          fill="none" stroke={COLORS.border} strokeWidth={2} rx={3} />
        {squares.map((sq, i) => {
          const sx = sq.x * scale + padding, sy = sq.y * scale + padding, ss = sq.size * scale;
          const isFocused = focusedGroup === sq.group;
          const visible = visibleGroup === null ? animStep === -1 || i <= animStep : visibleGroup === -1 || sq.group <= visibleGroup;
          const opacity = !visible ? 0 : focusedGroup === null ? 0.8 : isFocused ? 1 : 0.3;
          return (
            <g key={i} onMouseEnter={() => setHoveredGroup(sq.group)} onMouseLeave={() => setHoveredGroup(null)}
              style={{ cursor: "pointer" }}>
              <rect x={sx} y={sy} width={ss} height={ss}
                fill={SQUARE_COLORS[sq.colorIdx]} fillOpacity={opacity}
                stroke={isFocused ? COLORS.text : "#fff"} strokeWidth={isFocused ? 2.5 : 1}
                rx={2}
                style={{ transition: "all 0.6s ease" }} />
              {ss > (compact ? 22 : 28) && visible && (
                <text x={sx + ss / 2} y={sy + ss / 2} textAnchor="middle" dominantBaseline="central"
                  fill={COLORS.text} fontSize={Math.min(compact ? 9 : 12, ss * 0.16)}
                  fontFamily="inherit" fontWeight={700} style={{ opacity: isFocused ? 1 : 0.7 }}>
                  {`${sq.size} x ${sq.size}`}
                </text>
              )}
            </g>
          );
        })}
        {/* Spiral arcs */}
        {(() => {
          const arcs = [];
          let x = 0, y = 0, horizontal = true, w = a, h = b;
          steps.forEach((step, stepIdx) => {
            for (let i = 0; i < step.q; i++) {
              const side = horizontal ? h : w;
              const sx = x * scale + padding, sy = y * scale + padding, ss = side * scale;
              const orient = arcs.length % 4;
              let s1, s2;
              if (orient === 0) { s1 = { x: sx + ss, y: sy }; s2 = { x: sx, y: sy + ss }; }
              else if (orient === 1) { s1 = { x: sx + ss, y: sy + ss }; s2 = { x: sx, y: sy }; }
              else if (orient === 2) { s1 = { x: sx, y: sy + ss }; s2 = { x: sx + ss, y: sy }; }
              else { s1 = { x: sx, y: sy }; s2 = { x: sx + ss, y: sy + ss }; }
              const visible2 = visibleGroup === null ? animStep === -1 || arcs.length <= animStep : visibleGroup === -1 || stepIdx <= visibleGroup;
              arcs.push(<path key={arcs.length}
                d={`M ${s1.x} ${s1.y} A ${ss} ${ss} 0 0 1 ${s2.x} ${s2.y}`}
                fill="none" stroke={COLORS.primary} strokeWidth={Math.max(1, ss * 0.015)}
                strokeLinecap="round" opacity={visible2 ? 0.5 : 0} style={{ transition: "opacity 0.6s" }} />);
              if (horizontal) x += side; else y += side;
            }
            if (horizontal) w -= step.q * h; else h -= step.q * w;
            horizontal = !horizontal;
          });
          return arcs;
        })()}
        <text x={padding + a * scale / 2} y={padding - 8} textAnchor="middle"
          fill={COLORS.textLight} fontSize={compact ? 10 : 12} fontFamily="inherit" fontWeight={600}>{a}</text>
        <text x={padding - 10} y={padding + b * scale / 2} textAnchor="middle"
          fill={COLORS.textLight} fontSize={compact ? 10 : 12} fontFamily="inherit" fontWeight={600}
          transform={`rotate(-90,${padding - 10},${padding + b * scale / 2})`}>{b}</text>
      </svg>
      {!hideFooter && (
        <div style={{ fontSize: 11, color: COLORS.textLight, marginTop: 4 }}>
          {formatRRSRecipe(steps.map(s => s.q))} — {steps.length} steps, {steps.reduce((s, st) => s + st.q, 0)} squares
        </div>
      )}
    </div>
  );
}

function TabGCF() {
  const [a, setA] = useState(36);
  const [b, setB] = useState(24);
  const [inputA, setInputA] = useState("36");
  const [inputB, setInputB] = useState("24");
  const [traditionalStage, setTraditionalStage] = useState(0);
  const [panel, setPanel] = useState(0);

  const steps = useMemo(() => euclideanSteps(a, b), [a, b]);
  const factorA = useMemo(() => factorsOf(a), [a]);
  const factorB = useMemo(() => factorsOf(b), [b]);
  const commonFactors = useMemo(() => factorA.filter(f => factorB.includes(f)), [factorA, factorB]);
  const gcfValue = useMemo(() => gcd(a, b), [a, b]);
  const smallestStep = steps[steps.length - 1];

  useEffect(() => {
    if (traditionalStage < 3 && panel !== 0) setPanel(0);
  }, [traditionalStage, panel]);

  const apply = useCallback(() => {
    const na = parseInt(inputA), nb = parseInt(inputB);
    if (na > 1 && nb > 0 && na >= nb && na <= 500) {
      const larger = Math.max(na, nb);
      const smaller = Math.min(na, nb);
      setA(larger);
      setB(smaller);
      setInputA(String(larger));
      setInputB(String(smaller));
      setTraditionalStage(0);
      setPanel(0);
    }
  }, [inputA, inputB]);

  const presets = [
    { a: 36, b: 24, label: "36 & 24" },
    { a: 42, b: 30, label: "42 & 30" },
    { a: 48, b: 18, label: "48 & 18" },
    { a: 45, b: 15, label: "45 & 15" },
  ];

  const pickPair = useCallback((nextA, nextB) => {
    setA(nextA);
    setB(nextB);
    setInputA(String(nextA));
    setInputB(String(nextB));
    setTraditionalStage(0);
    setPanel(0);
  }, []);

  return (
    <div>
      <GCFTutorial
        presets={presets}
        gcfValue={gcfValue}
        onPickPair={pickPair}
        onListFactors={() => setTraditionalStage(1)}
        onHighlightCommon={() => setTraditionalStage(2)}
        onRevealGCF={() => setTraditionalStage(3)}
        onShowRRS={() => setPanel(1)}
      />

      <div style={styles.controlRow}>
        <div style={styles.presetRow}>
          {presets.map(p => (
            <button key={p.label}
              onClick={() => {
                pickPair(p.a, p.b);
              }}
              style={{ ...styles.presetBtn, ...(a === p.a && b === p.b ? styles.presetActive : {}) }}>
              {p.label}
            </button>
          ))}
        </div>
        <div style={styles.inputGroup}>
          <span style={styles.inputLabel}>Try:</span>
          <input style={styles.numInput} value={inputA} onChange={e => setInputA(e.target.value)} onKeyDown={e => e.key === "Enter" && apply()} />
          <span style={{ color: COLORS.textLight, fontWeight: 700 }}>and</span>
          <input style={styles.numInput} value={inputB} onChange={e => setInputB(e.target.value)} onKeyDown={e => e.key === "Enter" && apply()} />
          <button style={styles.goBtn} onClick={apply}>Go!</button>
        </div>
      </div>

      <div style={styles.gcfStageRow}>
        <div style={styles.gcfProgressDots}>
          {[0, 1, 2, 3].map(step => (
            <div key={step} style={{
              ...styles.gcfProgressDot,
              background: traditionalStage >= step ? COLORS.primary : COLORS.border,
              transform: traditionalStage === step ? "scale(1.2)" : "scale(1)",
            }} />
          ))}
        </div>
        <button
          style={{
            ...styles.gcfArrowBtn,
            ...(traditionalStage < 3 ? styles.gcfArrowBtnDisabled : {}),
          }}
          onClick={() => traditionalStage >= 3 && setPanel(1)}
          disabled={traditionalStage < 3}
        >
          {traditionalStage < 3 ? "Finish steps to unlock →" : "Slide to RRS →"}
        </button>
      </div>

      <div style={styles.gcfCarousel}>
        <div style={{ ...styles.gcfTrack, transform: `translateX(-${panel * 100}%)` }}>
          <div style={styles.gcfPanel}>
            <div style={styles.gcfPanelCard}>
              <div style={styles.gcfPanelHeader}>
                <div>
                  <div style={styles.backwardLabel}>Step 1 · Traditional Method</div>
                  <div style={styles.gcfPanelKicker}>Traditional Method</div>
                  <h3 style={styles.cardTitle}>Find all factors, then choose the greatest common one</h3>
                </div>
                <div style={styles.gcfBadge}>Numbers: {a} and {b}</div>
              </div>

              <div style={styles.gcfFactorGrid} data-grid2>
                <div style={styles.gcfFactorCard}>
                  <div style={styles.gcfFactorTitle}>Factors of {a}</div>
                  <div style={styles.gcfChipWrap}>
                    {traditionalStage === 0 ? (
                      <div style={styles.gcfPlaceholder}>Click “List Factors” to reveal them.</div>
                    ) : (
                      factorA.map(f => {
                        const isCommon = commonFactors.includes(f);
                        const isGreatest = f === gcfValue;
                        return (
                          <span key={`a-${f}`} style={{
                            ...styles.gcfChip,
                            ...(traditionalStage >= 2 && isCommon ? styles.gcfChipCommon : {}),
                            ...(traditionalStage >= 3 && isGreatest ? styles.gcfChipGreatest : {}),
                          }}>
                            {f}
                          </span>
                        );
                      })
                    )}
                  </div>
                </div>

                <div style={styles.gcfFactorCard}>
                  <div style={styles.gcfFactorTitle}>Factors of {b}</div>
                  <div style={styles.gcfChipWrap}>
                    {traditionalStage === 0 ? (
                      <div style={styles.gcfPlaceholder}>Click “List Factors” to reveal them.</div>
                    ) : (
                      factorB.map(f => {
                        const isCommon = commonFactors.includes(f);
                        const isGreatest = f === gcfValue;
                        return (
                          <span key={`b-${f}`} style={{
                            ...styles.gcfChip,
                            ...(traditionalStage >= 2 && isCommon ? styles.gcfChipCommon : {}),
                            ...(traditionalStage >= 3 && isGreatest ? styles.gcfChipGreatest : {}),
                          }}>
                            {f}
                          </span>
                        );
                      })
                    )}
                  </div>
                </div>
              </div>

              <div style={styles.gcfActionRow}>
                <button style={styles.playBtn} onClick={() => setTraditionalStage(1)} disabled={traditionalStage >= 1}>
                  1. List Factors
                </button>
                <button style={styles.playBtn} onClick={() => setTraditionalStage(2)} disabled={traditionalStage < 1 || traditionalStage >= 2}>
                  2. Highlight Common Factors
                </button>
                <button style={styles.playBtn} onClick={() => setTraditionalStage(3)} disabled={traditionalStage < 2 || traditionalStage >= 3}>
                  3. Reveal GCF
                </button>
              </div>

              <div style={styles.gcfInsight}>
                {traditionalStage < 2 && "Start by listing every factor of both numbers."}
                {traditionalStage === 2 && `The common factors are ${commonFactors.join(", ")}.`}
                {traditionalStage >= 3 && `The greatest common factor is ${gcfValue}. The arrow is now unlocked so you can compare it with the RRS picture.`}
              </div>

              <div style={styles.gcfMeaningCard}>
                <div style={styles.backwardMeaningTitle}>What to notice</div>
                <p style={styles.backwardMeaningText}>
                  This method tells you <b>which</b> number is greatest among the common factors, but it does not yet tell you why that number should also appear in the rectangle.
                </p>
              </div>
            </div>
          </div>

          <div style={styles.gcfPanel}>
            <div style={styles.gcfPanelCard}>
              <div style={styles.gcfPanelHeader}>
                <div>
                  <div style={styles.backwardLabel}>Step 2 · RRS Meaning</div>
                  <div style={styles.gcfPanelKicker}>RRS Method</div>
                  <h3 style={styles.cardTitle}>The smallest square tells us the GCF</h3>
                </div>
                <button style={styles.smallBtn} onClick={() => setPanel(0)}>← Back to factors</button>
              </div>

              <div style={styles.gcfRrsGrid} data-grid2>
                <div style={styles.rssVizCard}>
                  <div style={styles.rssVizHeader}>
                    <div>
                      <h3 style={styles.cardTitle}>RRS Rectangle</h3>
                      <p style={styles.rssVizHint}>
                        Keep cutting away the biggest possible squares. At the end, the smallest squares all have side length {gcfValue}.
                      </p>
                    </div>
                    <div style={styles.rssVizStat}>Smallest square: {gcfValue} × {gcfValue}</div>
                  </div>
                  <div style={styles.vizCenter}>
                    <RectViz a={a} b={b} activeGroup={steps.length - 1} showControls={false} />
                  </div>
                </div>

                <div style={styles.summaryCard}>
                  <h3 style={styles.cardTitle}>Why This Works</h3>
                  {steps.map((step, i) => (
                    <div key={`gcf-step-${i}`} style={{
                      ...styles.stepRow,
                      background: i === steps.length - 1 ? "#FFF0E5" : "transparent",
                    }}>
                      <span style={{ ...styles.stepDot, background: SQUARE_COLORS[i % 8] }} />
                      <span style={styles.stepText}>
                        Step {i + 1}: {step.a} ÷ {step.b} = {step.q} remainder {step.r}
                      </span>
                    </div>
                  ))}
                  <div style={styles.gcfProofBox}>
                    <b>Final RRS step:</b> {smallestStep.a} ÷ {smallestStep.b} = {smallestStep.q} remainder 0
                  </div>
                  <div style={styles.gcfProofBox}>
                    Since the process ends with squares of side length <b>{smallestStep.b}</b>, the GCF is <b>{smallestStep.b}</b>.
                  </div>
                  <div style={styles.gcfProofBox}>
                    Traditional method and RRS agree: <b>GCF({a}, {b}) = {gcfValue}</b>.
                  </div>
                </div>
              </div>

              <div style={styles.gcfMeaningCard}>
                <div style={styles.backwardMeaningTitle}>Why this matters</div>
                <p style={styles.backwardMeaningText}>
                  In the rectangle, the GCF becomes a <b>length</b>. It is the size of the square that can tile both starting sides exactly at the end of the RRS process.
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function TabArt() {
  const comparePairs = [
    {
      a: 55, b: 34, label: "55/34",
      badge: "Fibonacci Pair",
      note: "A long chain of 1s makes this rectangle feel especially balanced and close to the golden-ratio family.",
    },
    {
      a: 17, b: 12, label: "17/12",
      badge: "Near √2",
      note: "This recipe comes from a convergent of √2, so the picture echoes the patterned infinite recipe from Layer 2.",
    },
    {
      a: 97, b: 60, label: "97/60",
      badge: "Golden Neighbor",
      note: "Another ratio close to the golden ratio. Compare its shape rhythm with 55/34 and notice the shared one-heavy recipe.",
    },
    {
      a: 30, b: 11, label: "30/11",
      badge: "Shorter Rhythm",
      note: "This one has a shorter, chunkier recipe, so the picture breaks into larger visual blocks more quickly.",
    },
  ];
  const galleryCards = useMemo(() => comparePairs.map(pair => {
    const steps = euclideanSteps(pair.a, pair.b);
    const quotients = steps.map(step => step.q);
    return {
      ...pair,
      steps,
      quotients,
      recipe: formatRRSRecipe(quotients),
      stepCount: steps.length,
      totalSquares: quotients.reduce((sum, q) => sum + q, 0),
      ratio: (pair.a / pair.b).toFixed(4),
    };
  }), []);

  return (
    <div>
      <GalleryTutorial />

      <div style={styles.galleryArchiveGrid}>
        {galleryCards.map((card, i) => (
          <div key={i} style={styles.galleryArchiveCard}>
            <div style={styles.galleryArchiveHeader}>
              <div>
                <div style={styles.galleryArchiveBadge}>{card.badge}</div>
                <h3 style={{ ...styles.cardTitle, marginBottom: 6 }}>{card.label}</h3>
                <div style={styles.galleryArchiveMeta}>ratio ≈ {card.ratio}</div>
              </div>
              <code style={styles.galleryArchiveRecipe}>{card.recipe}</code>
            </div>

            <div style={styles.compareCard}>
              <RectViz a={card.a} b={card.b} label={card.label} compact />
            </div>

            <div style={styles.galleryArchiveFacts}>
              <div style={styles.galleryArchiveFact}>
                <span style={styles.galleryArchiveFactLabel}>RRS recipe</span>
                <span>{card.recipe}</span>
              </div>
              <div style={styles.galleryArchiveFact}>
                <span style={styles.galleryArchiveFactLabel}>Continued fraction</span>
                <span>same quotients, read as nested reciprocals</span>
              </div>
              <div style={styles.galleryArchiveFact}>
                <span style={styles.galleryArchiveFactLabel}>Division steps</span>
                <span>{card.stepCount}</span>
              </div>
              <div style={styles.galleryArchiveFact}>
                <span style={styles.galleryArchiveFactLabel}>Total squares</span>
                <span>{card.totalSquares}</span>
              </div>
            </div>

            <div style={styles.gcfMeaningCard}>
              <div style={styles.backwardMeaningTitle}>Visual signature</div>
              <p style={styles.backwardMeaningText}>{card.note}</p>
            </div>

            <div style={styles.quotientRow}>
              {card.quotients.map((q, qi) => (
                <span key={`${card.label}-q-${qi}`} style={{ ...styles.quotientBubble, background: SQUARE_COLORS[qi % SQUARE_COLORS.length] }}>
                  {q}
                </span>
              ))}
            </div>
          </div>
        ))}
      </div>

      <div style={styles.insightBox}>
        <h3 style={{ margin: "0 0 8px", color: COLORS.primary }}>💡 Gallery Insight</h3>
        <p style={{ margin: 0, lineHeight: 1.8 }}>
          A rectangle picture is not decoration added after the math. It is the math made visible. Different quotients create different square rhythms, and that gives each fraction its own geometric signature.
        </p>
      </div>
    </div>
  );
}

/* ─────────────── TAB 7: PI EXPLORER ─────────────── */
function TabPi() {
  const cases = [
    {
      key: "pi",
      label: "π",
      name: "Pi",
      value: Math.PI,
      cf: [3, 7, 15, 1, 292],
      recipe: "[3; 7,15,1,292,...]",
      standout: "The huge term 292",
      why: "This recipe keeps going forever, but it does not settle into a repeating loop. The big jump at 292 is what makes one later approximation dramatically stronger than the ones before it.",
      lookFor: "Pi keeps going, but it does not loop simply.",
      lookText: "Pi has an infinite continued fraction, but not a tidy repeating one. This is our Layer 3 example of a recipe that stays structured without falling into a simple loop.",
      verdictTitle: "This infinite recipe does not repeat simply.",
      verdictText: "Watch the arrows: some convergents land above π and some below it. The approximations still organize themselves in a meaningful way, but the continued fraction never settles into one repeating block.",
      tableText: "Each column comes from one term of π's continued fraction. The starred fraction is the principal convergent for that column, and the in-between fractions are semiconvergents. Switch to the error view to see why some fractions really stand out.",
      spotlightIndex: 3,
      conclusionLines: [
        "The huge term 292 means the next correction is tiny, which is why this convergent is so surprisingly strong.",
        "Pi is infinite, computable, and structured, but its continued fraction is not guided by one simple repeating block or one short visible rule.",
      ],
    },
    {
      key: "e",
      label: "e",
      name: "Euler's Number e",
      value: Math.E,
      cf: [2, 1, 2, 1, 1, 4, 1, 1, 6],
      recipe: "[2; 1,2,1,1,4,1,1,6,...]",
      standout: "The repeating shape 1, even, 1",
      why: "This recipe also keeps going forever, but it follows a visible rule: 1, 2, 1, 1, 4, 1, 1, 6, .... The pattern is there, but it is not one short block repeated forever.",
      lookFor: "e keeps going with a visible rule, but not a simple loop.",
      lookText: "The continued fraction for e is infinite, and it has structure you can name. Every third term grows: 2, 4, 6, ... while 1s sit in between.",
      verdictTitle: "This infinite recipe is rule-based, but not simply repeating.",
      verdictText: "The convergents still alternate above and below e, and the continued fraction still improves step by step. But unlike √2 or the metallic ratios, it does not collapse into one endlessly repeated block.",
      tableText: "Each column comes from one term of e's continued fraction. The starred fraction is the principal convergent for that column, and the in-between fractions are semiconvergents. Switch to the error view to compare the same improvement process under a more visible rule.",
      spotlightIndex: 5,
      conclusionLines: [
        "The pattern 1, 2k, 1 helps explain why the convergents keep improving even though the continued fraction never becomes a one-block loop.",
        "e sits in Layer 3 too: infinite, computable, and structured, but not simply repeating in the way square roots do.",
      ],
    },
  ];
  const [selected, setSelected] = useState("pi");
  const [revealed, setRevealed] = useState(1); // columns revealed
  const [showQp, setShowQp] = useState(false);
  const current = cases.find(item => item.key === selected) || cases[0];
  const targetValue = current.value;

  useEffect(() => {
    setRevealed(1);
    setShowQp(false);
  }, [selected]);

  // Build Euler's table: for each column, generate all semiconvergents
  const columns = useMemo(() => {
    const cols = [];
    // convergents: p_{-1}/q_{-1} = 1/0, p_0/q_0 = a_0/1
    let pPrev = 1, qPrev = 0, pCurr = current.cf[0], qCurr = 1;
    cols.push({ header: current.cf[0], entries: [{ p: pCurr, q: qCurr, principal: true }] });

    for (let k = 1; k < current.cf.length; k++) {
      const ak = current.cf[k];
      const entries = [];
      // semiconvergents: (i * pCurr + pPrev) / (i * qCurr + qPrev) for i = 1..ak
      for (let i = 1; i <= Math.min(ak, 15); i++) {
        entries.push({
          p: i * pCurr + pPrev,
          q: i * qCurr + qPrev,
          principal: i === ak,
        });
      }
      if (ak > 15) entries.push({ ellipsis: true, total: ak });
      cols.push({ header: ak, entries });
      // advance
      const pNext = ak * pCurr + pPrev;
      const qNext = ak * qCurr + qPrev;
      pPrev = pCurr; qPrev = qCurr;
      pCurr = pNext; qCurr = qNext;
    }
    return cols;
  }, [current]);
  const principalConvergents = useMemo(
    () => columns.map(col => col.entries.find(entry => entry.principal)).filter(Boolean),
    [columns]
  );
  const specialApprox = principalConvergents[Math.min(current.spotlightIndex, principalConvergents.length - 1)];

  return (
    <div>
      <PiTutorial
        onStart={() => {
          setRevealed(3);
          setShowQp(false);
        }}
      />

      <div style={styles.cfExampleRow}>
        {cases.map(item => (
          <button
            key={item.key}
            onClick={() => setSelected(item.key)}
            style={{
              ...styles.presetBtn,
              ...(selected === item.key ? styles.presetActive : {}),
            }}
          >
            {item.label}
          </button>
        ))}
      </div>

      <div style={{ ...styles.gcfTutorHint, marginTop: -6, marginBottom: 14 }}>
        🥧 Take a little <b>pi / e</b> break and compare two Layer 3 recipes.
      </div>

      <div style={styles.controlRow}>
        <span style={styles.inputLabel}>Reveal more of {current.label}'s recipe:</span>
        {current.cf.map((_, i) => (
          <button key={i} onClick={() => setRevealed(i + 1)}
            style={{ ...styles.presetBtn, ...(revealed === i + 1 ? styles.presetActive : {}) }}>
            {i + 1}
          </button>
        ))}
        <button style={{ ...styles.modeBtn, marginLeft: "auto" }}
          onClick={() => setShowQp(!showQp)}>
          {showQp ? "Show decimal value" : "Show approximation error"}
        </button>
      </div>

      <div style={styles.explorerGrid}>
        <div style={styles.explorerCard}>
          <h3 style={styles.cardTitle}>Recipe Snapshot</h3>
          <div style={styles.cfResult}>
            <div style={styles.cfLabel}>Continued Fraction / RRS Recipe:</div>
            <code style={styles.cfCode}>{current.recipe}</code>
          </div>
          <div style={styles.cfResult}>
            <div style={styles.cfLabel}>What stands out?</div>
            <b style={{ color: COLORS.primary, fontSize: 18 }}>{current.standout}</b>
          </div>
          <div style={styles.cfResult}>
            <div style={styles.cfLabel}>Why it matters:</div>
            <p style={{ margin: "4px 0 0", fontSize: 13, lineHeight: 1.7, color: COLORS.textLight }}>
              {current.why}
            </p>
          </div>
        </div>

        <div style={styles.explorerCard}>
          <h3 style={styles.cardTitle}>Best Fraction Approximations</h3>
          <div style={styles.algoHeader}>
            These principal convergents are the main milestones on the way to {current.label} ≈ {targetValue.toFixed(6)}.
          </div>
          <div style={{ fontSize: 13, lineHeight: 2 }}>
            {principalConvergents.slice(0, 5).map((c, i) => {
              const decVal = c.p / c.q;
              const err = Math.abs(decVal - targetValue);
              return (
                <div key={`principal-${i}`} style={styles.convergentRow}>
                  <span style={styles.convergentFrac}>{c.p}/{c.q}</span>
                  <span style={{ color: COLORS.textLight }}>= {decVal.toFixed(6)}</span>
                  <span style={{
                    ...styles.explorerMetaPill,
                    color: decVal > targetValue ? COLORS.pink : COLORS.secondary,
                  }}>
                    {decVal > targetValue ? "above" : "below"}
                  </span>
                  <span style={{ color: COLORS.purple, fontSize: 11 }}>
                    (error: {err.toExponential(1)})
                  </span>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      <div style={styles.explorerStoryGrid}>
        <div style={styles.explorerStoryCard}>
          <div style={styles.explorerStoryKicker}>What to Look For</div>
          <div style={styles.explorerStoryTitle}>{current.lookFor}</div>
          <p style={styles.explorerStoryText}>
            {current.lookText}
          </p>
        </div>
        <div style={styles.explorerStoryCard}>
          <div style={styles.explorerStoryKicker}>Watch the Convergents</div>
          <div style={styles.explorerStoryTitle}>The fractions still improve.</div>
          <p style={styles.explorerStoryText}>
            The starred entries are the <b>principal convergents</b>. The others are semiconvergents that sit in between. Together they show how the approximations get better, often alternating above and below the target.
          </p>
        </div>
        <div style={styles.explorerStoryCard}>
          <div style={styles.explorerStoryKicker}>Pattern Verdict</div>
          <div style={styles.explorerStoryTitle}>{current.verdictTitle}</div>
          <p style={styles.explorerStoryText}>
            {current.verdictText}
          </p>
        </div>
      </div>

      <div style={styles.explorerCard}>
        <h3 style={styles.cardTitle}>Euler Table of Convergents</h3>
        <p style={{ margin: "0 0 12px", fontSize: 13, lineHeight: 1.7, color: COLORS.textLight }}>
          {current.tableText}
        </p>
      </div>

      <div style={styles.piTableWrap}>
        <div style={styles.piTable}>
          {columns.slice(0, revealed).map((col, ci) => (
            <div key={ci} style={styles.piCol}>
              <div style={styles.piColHeader}>{col.header}</div>
              <div style={styles.piColBody}>
                {col.entries.map((e, ei) => {
                  if (e.ellipsis) return (
                    <div key={ei} style={{ ...styles.piCell, fontStyle: "italic", color: COLORS.textLight }}>
                      ... ({e.total} total)
                    </div>
                  );
                  const qpVal = Math.abs(e.q * targetValue - e.p);
                  const decVal = e.p / e.q;
                  const overUnder = decVal > targetValue ? "↑" : "↓";
                  return (
                    <div key={ei} style={{
                      ...styles.piCell,
                      ...(e.principal ? styles.piCellPrincipal : {}),
                    }}>
                      <div style={styles.piFrac}>
                        <div style={styles.piNum}>{e.p}</div>
                        <div style={styles.piDen}>{e.q}</div>
                      </div>
                      <div style={styles.piMeta}>
                        {showQp ? qpVal.toFixed(4) : decVal.toFixed(4)}{" "}
                        <span style={{ color: decVal > targetValue ? COLORS.pink : COLORS.secondary }}>{overUnder}</span>
                      </div>
                      {e.principal && <div style={styles.piPrincipalTag}>★ principal</div>}
                    </div>
                  );
                })}
              </div>
            </div>
          ))}
        </div>
      </div>

      {specialApprox && (
        <div style={styles.insightBox}>
          <h3 style={{ margin: "0 0 8px", color: COLORS.primary }}>Conclusion</h3>
          <div style={{ fontSize: 13, lineHeight: 1.8 }}>
            <p style={{ margin: "4px 0" }}>

/* ─────────────── STORY: NUMBER Q ─────────────── */
function StoryNumberQ({ onContinue, onSkip }) {
  const [text, setText] = useState("");

  const detect = (input) => {
    const found = { whole: false, fraction: false, decimal: false, negative: false, irrational: false, empty: false };
    const trimmed = input.trim();
    // "I don't know" / "not sure" / empty → treat as no-input
    // Uses .test() on normalized lowercase to handle "I'm not sure", "dunno", etc.
    const lower = trimmed.toLowerCase();
    if (!trimmed ||
        /^\?+$/.test(lower) ||
        /^hmm+$/.test(lower) ||
        /\b(don'?t know|dunno|idk|no idea|not sure|unsure|nothing)\b/.test(lower)) {
      found.empty = true;
      return found;
    }
    if (/\b\d+\b/.test(input)) found.whole = true;
    if (/\d+\s*\/\s*\d+|fraction/i.test(input)) found.fraction = true;
    if (/\d+\.\d+|decimal/i.test(input)) found.decimal = true;
    if (/(^|\s|,)-\d+|negative/i.test(input)) found.negative = true;
    // More specific irrational detection: require word boundaries and actual math symbols
    if (/√|\bsqrt\b|\bpi\b|π|\birrational\b|∞|\binfinity\b|(^|\s)e($|\s|,)/i.test(input)) found.irrational = true;
    return found;
  };

  const handleShare = () => {
    onContinue(detect(text), text);
  };

  return (
    <div style={styles.storyScreen}>
      <div style={{ fontSize: 48, marginBottom: 12 }}>🤔</div>
      <h2 style={styles.storyTitle}>What do you think is a number?</h2>
      <p style={{ ...styles.storyBigText, fontSize: 16 }}>
        Type any numbers or ideas that come to mind!
      </p>
      <textarea
        style={styles.storyTextarea}
        value={text}
        onChange={e => setText(e.target.value)}
        placeholder="e.g. 1, 2, 3... or 1/2, √2, π, anything!"
        rows={3}
      />
      <div style={{ display: "flex", gap: 10, marginTop: 16, flexWrap: "wrap", justifyContent: "center" }}>
        <button style={styles.bigBtn} onClick={handleShare} disabled={!text.trim()}>Share!</button>
        <button style={styles.skipBtn} onClick={onSkip}>Skip →</button>
      </div>
    </div>
  );
}

            <span style={styles.titleEmoji}>🏖️</span>
            Number Sandbox
          </h1>
          <p style={styles.headerDesc}>
            Explore how rectangles become recipes, and how recipes reveal different kinds of numbers.
          </p>
        </header>

        {/* Mode toggle + restart */}
        <div style={styles.topBar}>
          <div style={styles.modePills}>
            <button style={{ ...styles.modePill, ...(mode === "story" ? styles.modePillActive : {}) }}
              onClick={() => setMode("story")}>📖 Story Mode</button>
            <button style={{ ...styles.modePill, ...(mode === "explore" ? styles.modePillActive : {}) }}
              onClick={() => setMode("explore")}>🔧 Free Explore</button>
          </div>
          {mode === "story" && (
            <button style={styles.restartBtn} onClick={restartStory}>↺ Restart Story</button>
          )}
        </div>

        {mode === "story" && (
          <main style={styles.main}>{renderStory()}</main>
        )}

        {mode === "branch" && (
          <>
            <div style={styles.storyBanner}>
              🌳 Exploring branch: <b>{TAB_NAMES[tab]}</b>
              <button style={styles.skipBtn} onClick={returnToTree}>← Back to Tree</button>
            </div>
            <main style={styles.main}><ActiveTab /></main>
          </>
        )}

        {mode === "explore" && (
          <>
            <nav style={styles.tabBar}>
              {TAB_NAMES.map((name, i) => (
                <button key={i} onClick={() => setTab(i)}
                  style={{ ...styles.tab, ...(tab === i ? styles.tabActive : {}) }}>
                  <span style={styles.tabIcon}>{TAB_ICONS[i]}</span>
                  <span style={styles.tabLabel}>{name}</span>
                </button>
              ))}
            </nav>
            <main style={styles.main}><ActiveTab /></main>
          </>
        )}

        <footer style={styles.footer}>
          Made with math & curiosity ✨
          <br />
          Special Thanks for Dr. Chazan, Dr. Bill, and Spring26 788Y Classmates💕
        </footer>
      </div>
    </div>
  );
}

    color: COLORS.primary,

  threeCol: {

  qaCorrect: {

  qaWrong: {
    marginTop: 8, padding: "6px 10px",
    background: "#FEE", borderRadius: 8,

  },
  seqReveal: {
    marginTop: 10,
    animation: "fadeIn 0.5s ease",

  seqBox: {
