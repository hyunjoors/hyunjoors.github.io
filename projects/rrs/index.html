/* ─────────────── UTILITIES ─────────────── */
function gcd(a, b) { while (b) { [a, b] = [b, a % b]; } return a; }

function euclideanSteps(a, b) {
  const steps = [];
  while (b !== 0) {
    const q = Math.floor(a / b);
    const r = a % b;
    steps.push({ a, b, q, r });
    a = b; b = r;
  }
  return steps;
}

function sqrtCF(r, maxTerms = 20) {
  const a0 = Math.floor(Math.sqrt(r));
  if (a0 * a0 === r) return { terms: [a0], period: [], convergents: [{ p: a0, q: 1 }], perfect: true };
  const terms = [a0];
  const states = [];
  let m = a0, d = r - a0 * a0;
  const convergents = [{ p: a0, q: 1 }];
  let p_prev = 1, p_curr = a0, q_prev = 0, q_curr = 1;
  for (let i = 0; i < maxTerms; i++) {
    const an = Math.floor((a0 + m) / d);
    terms.push(an);
    const mNext = an * d - m;
    const dNext = (r - mNext * mNext) / d;
    states.push({ m, d, an, mNext, dNext });
    const p_new = an * p_curr + p_prev;
    const q_new = an * q_curr + q_prev;
    convergents.push({ p: p_new, q: q_new });
    p_prev = p_curr; p_curr = p_new;
    q_prev = q_curr; q_curr = q_new;
    m = mNext; d = dNext;
    if (an === 2 * a0) break;
  }
  return { terms, period: terms.slice(1), convergents, states, a0, perfect: false };
}

function buildSquares(a, b, steps) {
  const squares = [];
  let x = 0, y = 0, horizontal = true, w = a, h = b, colorIdx = 0;
  for (const step of steps) {
    for (let i = 0; i < step.q; i++) {
      const side = horizontal ? h : w;
      squares.push({ x, y, size: side, colorIdx: colorIdx % 8, group: colorIdx, stepIdx: squares.length });
      if (horizontal) x += side; else y += side;
    }
    if (horizontal) w -= step.q * h; else h -= step.q * w;
    horizontal = !horizontal; colorIdx++;
  }
  return squares;
}

function factorsOf(n) {
  const factors = [];
  for (let i = 1; i <= n; i++) {
    if (n % i === 0) factors.push(i);
  }
  return factors;
}

// Continued-fraction style recipe formatting:
// [q0; q1,q2,...] (semicolon after the first quotient, commas after that).
function formatRRSRecipe(quotients) {
  const qs = Array.isArray(quotients) ? quotients.filter(q => Number.isFinite(q)) : [];
  if (qs.length === 0) return "[]";
  if (qs.length === 1) return `[${qs[0]}]`;
  return `[${qs[0]}; ${qs.slice(1).join(",")}]`;
}

function backwardBuild(smallestSize, counts) {
  const stages = [];
  const sizeTrail = [smallestSize];
  let previousSize = 0;
  let currentSize = smallestSize;

  counts.forEach((count, idx) => {
    const nextSize = count * currentSize + previousSize;
    stages.push({
      idx,
      count,
      squareSize: currentSize,
      previousSize,
      nextSize,
      landsAtRectangle: idx === counts.length - 1,
    });
    previousSize = currentSize;
    currentSize = nextSize;
    sizeTrail.push(nextSize);
  });

  return {
    stages,
    sizeTrail,
    finalWidth: currentSize,
    finalHeight: previousSize,
    forwardSequence: [...counts].reverse(),
    reverseSequence: counts,
  };
}

/* ─────────────── TEACHER BUBBLE (TYPEWRITER) ─────────────── */
function TeacherBubble({ text, onDone, speed = 40 }) {
  const [shown, setShown] = useState("");
  const onDoneRef = useRef(onDone);
  // Keep ref up to date without triggering effect re-runs
  useEffect(() => { onDoneRef.current = onDone; }, [onDone]);

  useEffect(() => {
    setShown("");
    let i = 0;
    let finished = false;
    const timer = setInterval(() => {
      i++;
      setShown(text.slice(0, i));
      if (i >= text.length && !finished) {
        finished = true;
        clearInterval(timer);
        if (onDoneRef.current) onDoneRef.current();
      }
    }, speed);
    return () => clearInterval(timer);
  }, [text, speed]);  // only re-run when text or speed changes

  return (
    <div style={styles.teacherRow}>
      <div style={styles.teacherAvatar}>🧑‍🏫</div>
      <div style={styles.teacherBubble}>
        {shown}
        {shown.length < text.length && <span style={styles.teacherCursor}>▊</span>}
      </div>
    </div>
  );
}

/* ─────────────── RSS TUTORIAL ─────────────── */
function RSSTutorial({ initialStep = 0, divisionDone = false, onTryAgain, onPickPair, onStartPractice, onComplete, onPlayReveal }) {
  const [step, setStep] = useState(initialStep);
  const [done, setDone] = useState(false);
  const [typed, setTyped] = useState(false);
  const [customA, setCustomA] = useState("");
  const [customB, setCustomB] = useState("");
  const [chosenPair, setChosenPair] = useState(null);
  const [guess, setGuess] = useState(null);

  useEffect(() => {
    if (done && onComplete) onComplete();
  }, [done, onComplete]);

  // If the student replays the division while we're on the reflection step,
  // reset typing so the button doesn't appear early.
  useEffect(() => {
    if (step === 4 && !divisionDone) setTyped(false);
  }, [step, divisionDone]);

  if (done) {
    return (
      <div style={styles.tutorialDone}>
        <TeacherBubble text={`Great job! Now explore on your own — try any numbers you like! 🎉`} />
        <button style={styles.smallBtn} onClick={() => {
          if (onTryAgain) return onTryAgain();
          setStep(1);
          setDone(false);
          setTyped(false);
          setChosenPair(null);
          setCustomA("");
          setCustomB("");
          setGuess(null);
        }}>
          ↺ Try again
        </button>
      </div>
    );
  }

  // Step 0: Greeting
  if (step === 0) {
    return (
      <div style={styles.tutorialCard}>
        <TeacherBubble
          text="Hi! I'm Professor Sandbox. Let's break apart some numbers together!"
          onDone={() => setTyped(true)}
        />
        {typed && (
          <div style={styles.tutorialActions}>
            <button style={styles.bigBtn} onClick={() => { setStep(1); setTyped(false); }}>
              Let's go! →
            </button>
            <button style={styles.skipBtn} onClick={() => setDone(true)}>Skip tutorial</button>
          </div>
        )}
      </div>
    );
  }

  // Step 1: Pick a pair
  if (step === 1) {
    const pairs = [
      { a: 55, b: 34, label: "55 and 34", note: "Fibonacci friends!" },
      { a: 17, b: 12, label: "17 and 12", note: "Close to √2" },
      { a: 30, b: 11, label: "30 and 11", note: "My favorite!" },
    ];
    return (
      <div style={styles.tutorialCard}>
        <TeacherBubble
          text="First, pick two numbers. Which pair should we try?"
          onDone={() => setTyped(true)}
        />
        {typed && (
          <div style={styles.tutorialOptions}>
            {pairs.map(p => (
              <button key={p.label} style={{
                ...styles.tutorialOption,
                ...(chosenPair === p.label ? styles.tutorialOptionActive : {}),
              }} onClick={() => {
                setChosenPair(p.label);
                onPickPair(p.a, p.b);
              }}>
                <div style={{ fontSize: 18, fontWeight: 800 }}>{p.label}</div>
                <div style={{ fontSize: 11, color: COLORS.textLight }}>{p.note}</div>
              </button>
            ))}
            <div style={styles.tutorialOrDivider}>— or type your own! —</div>
            <div style={{ display: "flex", gap: 8, alignItems: "center", justifyContent: "center" }}>
              <input style={styles.numInput} placeholder="big" value={customA}
                onChange={e => setCustomA(e.target.value)} />
              <span style={{ fontWeight: 700 }}>and</span>
              <input style={styles.numInput} placeholder="smaller" value={customB}
                onChange={e => setCustomB(e.target.value)} />
              <button style={styles.goBtn} onClick={() => {
                const na = parseInt(customA), nb = parseInt(customB);
                if (na > 1 && nb > 0 && na > nb && na <= 500) {
                  setChosenPair(`${na} and ${nb}`);
                  onPickPair(na, nb);
                }
              }}>Pick!</button>
            </div>
          </div>
        )}
        {chosenPair && (
          <div style={styles.tutorialActions}>
            <button style={styles.bigBtn} onClick={() => { setStep(3); setTyped(false); }}>
              Great choice! →
            </button>
          </div>
        )}
      </div>
    );
  }

  // Step 2 (prediction) removed — not appropriate before students know what RSS is.
  // The prediction prompt now lives in the post-tutorial "new pair" flow.

  // Step 3: Student practice
  if (step === 3) {
    return (
      <div style={{ ...styles.tutorialCard, ...styles.tutorialHighlight }}>
        <TeacherBubble
          text={`Nice, ${chosenPair}! This time, YOU will do the division. Fill in each step: a ÷ b = q remainder r. When you're correct, the rectangle picture will update!`}
          onDone={() => setTyped(true)}
        />
        {typed && (
          <div style={styles.tutorialActions}>
            <button style={{ ...styles.bigBtn, animation: "pulse 1.5s infinite" }} onClick={() => {
              if (onPlayReveal) onPlayReveal(); // reveal practice UI
              if (onStartPractice) onStartPractice();
              setStep(4); // reflection waits until divisionDone becomes true
              setTyped(false);
            }}>
              ▶ Start practice!
            </button>
          </div>
        )}
      </div>
    );
  }

  // Step 4: Reflect
  if (step === 4) {
    if (!divisionDone) return null; // wait until the division animation has fully finished
    return (
      <div style={styles.tutorialCard}>
        <TeacherBubble
          text="See all those division steps? Each one is a chunk of the RSS recipe. When the remainder becomes 0, the division is finished!"
          onDone={() => setTyped(true)}
        />
        {typed && (
          <div style={styles.tutorialActions}>
            <button style={styles.bigBtn} onClick={() => setDone(true)}>Got it! ✓</button>
          </div>
        )}
      </div>
    );
  }

  return null;
}

/* ─────────────── TAB 1: RSS MACHINE ─────────────── */
function TabRSS() {
  const [a, setA] = useState(55);
  const [b, setB] = useState(34);
  const [inputA, setInputA] = useState("55");
  const [inputB, setInputB] = useState("34");
  const [currentStep, setCurrentStep] = useState(-1);
  const [autoPlay, setAutoPlay] = useState(false);
  const [tutorialComplete, setTutorialComplete] = useState(false);
  const [showPlayView, setShowPlayView] = useState(false);
  const [predictionGuess, setPredictionGuess] = useState(null);
  const [showPrediction, setShowPrediction] = useState(false);
  const [tutorialKey, setTutorialKey] = useState(0);
  const [tutorialStartStep, setTutorialStartStep] = useState(0);
  const [practiceMode, setPracticeMode] = useState(false);
  const [practiceIdx, setPracticeIdx] = useState(0);
  const [practiceReveal, setPracticeReveal] = useState(-2); // -2 means show no squares yet
  const [practiceQ, setPracticeQ] = useState("");
  const [practiceR, setPracticeR] = useState("");
  const [practiceChecked, setPracticeChecked] = useState(null); // null | true | false
  // Q&A state (appears after animation finishes)
  const [stepAnswer, setStepAnswer] = useState("");
  const [stepCorrect, setStepCorrect] = useState(null);
  const [sqAnswer, setSqAnswer] = useState("");
  const [sqCorrect, setSqCorrect] = useState(null);
  const [showSeqIntro, setShowSeqIntro] = useState(false);
  const timerRef = useRef(null);

  // Reset Q&A whenever a/b changes
  useEffect(() => {
    setStepAnswer(""); setStepCorrect(null);
    setSqAnswer(""); setSqCorrect(null);
    setShowSeqIntro(false);
    setPracticeMode(false);
    setPracticeIdx(0);
    setPracticeReveal(-2);
    setPracticeQ(""); setPracticeR(""); setPracticeChecked(null);
  }, [a, b]);

  // Helper: when student picks a NEW pair after tutorial, ask for prediction
  const pickNewPair = (newA, newB) => {
    setA(newA); setB(newB);
    setInputA(String(newA)); setInputB(String(newB));
    setCurrentStep(-1); setAutoPlay(false);
    setPracticeMode(false);
    setPracticeIdx(0);
    setPracticeReveal(-2);
    setPracticeQ(""); setPracticeR(""); setPracticeChecked(null);
    if (tutorialComplete) {
      setPredictionGuess(null);
      setShowPrediction(true);
    }
  };

  const steps = useMemo(() => euclideanSteps(a, b), [a, b]);
  const totalSquares = useMemo(() => steps.reduce((s, st) => s + st.q, 0), [steps]);

  const resetToPick = useCallback(() => {
    if (timerRef.current) clearTimeout(timerRef.current);
    setA(55); setB(34);
    setInputA("55"); setInputB("34");
    setCurrentStep(-1);
    setAutoPlay(false);
    setTutorialComplete(false);
    setShowPlayView(false);
    setPredictionGuess(null);
    setShowPrediction(false);
    setStepAnswer(""); setStepCorrect(null);
    setSqAnswer(""); setSqCorrect(null);
    setShowSeqIntro(false);
    setPracticeMode(false);
    setPracticeIdx(0);
    setPracticeReveal(-2);
    setPracticeQ(""); setPracticeR(""); setPracticeChecked(null);
    setTutorialStartStep(1);
    setTutorialKey(k => k + 1); // remount tutorial so it returns to the number-pick page
  }, []);

  const startPractice = useCallback(() => {
    if (timerRef.current) clearTimeout(timerRef.current);
    setAutoPlay(false);
    setPracticeMode(true);
    setPracticeIdx(0);
    setPracticeReveal(-2);
    setPracticeQ(""); setPracticeR(""); setPracticeChecked(null);
    setCurrentStep(-1);
  }, []);

  const practiceDone = useMemo(() => practiceMode && practiceReveal >= steps.length - 1, [practiceMode, practiceReveal, steps.length]);
  const divisionDone = useMemo(() => practiceMode ? practiceDone : (currentStep >= steps.length - 1 && currentStep !== -1), [practiceMode, practiceDone, currentStep, steps.length]);
  const vizStep = practiceMode ? practiceReveal : currentStep;

  const practiceCheck = useCallback(() => {
    const step = steps[practiceIdx];
    if (!step) return;
    const q = parseInt(practiceQ, 10);
    const r = parseInt(practiceR, 10);
    const ok = Number.isFinite(q) && Number.isFinite(r) && q === step.q && r === step.r;
    setPracticeChecked(ok);
    if (ok) setPracticeReveal(practiceIdx);
  }, [steps, practiceIdx, practiceQ, practiceR]);

  const practiceNext = useCallback(() => {
    if (practiceChecked !== true) return;
    if (practiceIdx >= steps.length - 1) return;
    setPracticeIdx(i => Math.min(steps.length - 1, i + 1));
    setPracticeQ(""); setPracticeR(""); setPracticeChecked(null);
  }, [practiceChecked, practiceIdx, steps.length]);

  const apply = useCallback(() => {
    const na = parseInt(inputA), nb = parseInt(inputB);
    if (na > 1 && nb > 0 && na > nb && na <= 500) {
      pickNewPair(na, nb);
    }
  }, [inputA, inputB, tutorialComplete]);

  useEffect(() => {
    if (practiceMode) return;
    if (autoPlay && currentStep < steps.length - 1) {
      timerRef.current = setTimeout(() => setCurrentStep(s => s + 1), 1800);
      return () => clearTimeout(timerRef.current);
    }
    if (currentStep >= steps.length - 1) setAutoPlay(false);
  }, [practiceMode, autoPlay, currentStep, steps.length]);

  const visibleSteps = useMemo(() => {
    if (practiceMode) return steps.slice(0, Math.min(steps.length, practiceIdx + 1));
    return currentStep === -1 ? steps : steps.slice(0, currentStep + 1);
  }, [practiceMode, steps, currentStep, practiceIdx]);
  const presets = [
    { a: 55, b: 34, label: "55 & 34" }, { a: 17, b: 12, label: "17 & 12" },
    { a: 30, b: 11, label: "30 & 11" }, { a: 76, b: 47, label: "76 & 47" },
    { a: 97, b: 60, label: "97 & 60" },
  ];

  return (
    <div>
      <RSSTutorial
        key={tutorialKey}
        initialStep={tutorialStartStep}
        divisionDone={divisionDone}
        onTryAgain={resetToPick}
        onPickPair={(pa, pb) => {
          setA(pa); setB(pb);
          setInputA(String(pa)); setInputB(String(pb));
          setCurrentStep(-1); setAutoPlay(false);
          setPracticeMode(false);
          setPracticeIdx(0);
          setPracticeReveal(-2);
          setPracticeQ(""); setPracticeR(""); setPracticeChecked(null);
        }}
        onStartPractice={startPractice}
        onPlayReveal={() => setShowPlayView(true)}
        onComplete={() => {
          setTutorialComplete(true);
          setShowPlayView(true);
          setPracticeMode(false);
          setPracticeIdx(0);
          setPracticeReveal(-2);
          setPracticeQ(""); setPracticeR(""); setPracticeChecked(null);
        }}
      />

      {/* TIER 1: Visible during Press Play demo (3-column layout) */}
      {showPlayView && (
        <div className="three-col" style={styles.threeCol}>
          {/* LEFT: Division Steps */}
          <div style={styles.stepsCard}>
            <h3 style={styles.cardTitle}>Division Steps</h3>
            {visibleSteps.map((s, i) => (
              <div key={i} style={{
                ...styles.stepRow,
                background: i === (practiceMode ? practiceIdx : currentStep) ? "#FFF0E5" : "transparent",
                transition: "all 0.8s ease",
              }}>
                <span style={{ ...styles.stepDot, background: SQUARE_COLORS[i % 8] }} />
                <span style={styles.stepText}>
                  <b style={{ color: COLORS.primary }}>Step {i + 1}:</b>{" "}
                  {s.a} ÷ {s.b} ={" "}
                  <span style={{ color: COLORS.primary, fontWeight: 800, fontSize: 18 }}>
                    {practiceMode && i > practiceReveal ? "?" : s.q}
                  </span>{" "}
                  R{" "}
                  <span style={{ color: COLORS.purple, fontWeight: 700 }}>
                    {practiceMode && i > practiceReveal ? "?" : s.r}
                  </span>
                </span>
              </div>
            ))}
            <div style={{ marginTop: 12, display: "flex", gap: 6, flexWrap: "wrap" }}>
              <button style={styles.smallBtn} onClick={() => {
                if (practiceMode) {
                  setPracticeIdx(0);
                  setPracticeReveal(-2);
                  setPracticeQ(""); setPracticeR(""); setPracticeChecked(null);
                } else {
                  setCurrentStep(0); setAutoPlay(true);
                  setStepAnswer(""); setStepCorrect(null);
                  setSqAnswer(""); setSqCorrect(null);
                  setShowSeqIntro(false);

/* ─────────────── TAB 3: SQRT EXPLORER ─────────────── */
function TabSqrt() {
  const [r, setR] = useState(2);
  const [showGuided, setShowGuided] = useState(true);
  const [guidedStep, setGuidedStep] = useState(0);

  const cf = useMemo(() => sqrtCF(r, 20), [r]);
  const sqrtApprox = useMemo(() => cf.convergents.slice(1, 7), [cf]);
  const isqrt = Math.floor(Math.sqrt(r));
  const isPerfect = isqrt * isqrt === r;

  const guidedSteps2 = [
    { title: "Start with √2", content: `We know √2 is between 1 and 2 (since 1² = 1 and 2² = 4).\nSo the integer part is 1. Write: √2 = 1 + (√2 − 1)` },
    { title: "Flip the fractional part", content: `Take the leftover (√2 − 1) and flip it:\n1/(√2 − 1)\n\nMultiply top and bottom by (√2 + 1):\n= (√2 + 1) / ((√2)² − 1²)\n= (√2 + 1) / (2 − 1)\n= √2 + 1` },
    { title: "Find integer part again", content: `√2 + 1 ≈ 2.414...\nInteger part = 2. Leftover = √2 + 1 − 2 = √2 − 1\n\n...wait, that's the SAME leftover as Step 1!` },
    { title: "It repeats forever!", content: `Since we got √2 − 1 again, the process loops:\n\n√2 = 1 + 1/(2 + 1/(2 + 1/(2 + ...)))\n\nRSS Recipe: [1; 2, 2, 2, 2, ...]\nThe 2 repeats forever! ♾️` },
  ];

  const guidedSteps17 = [
    { title: "Start with √17", content: `√17 is between 4 and 5 (since 4² = 16 and 5² = 25).\nInteger part = 4. Write: √17 = 4 + (√17 − 4)` },
    { title: "Flip and rationalize", content: `1/(√17 − 4) × (√17 + 4)/(√17 + 4)\n= (√17 + 4)/(17 − 16)\n= √17 + 4\n\nSo: √17 = 4 + 1/(√17 + 4)` },
    { title: "Self-substitution!", content: `Since √17 appears on both sides:\n√17 = 4 + 1/(4 + √17)\n     = 4 + 1/(4 + 4 + 1/(4 + √17))\n     = 4 + 1/(8 + 1/(4 + √17))` },
    { title: "The repeating pattern", content: `Keep going and the pattern emerges:\n\n√17 = [4; 8, 8, 8, 8, ...]\n     = [4; (8)]\n\nThe 8 repeats forever!\nNotice: 8 = 2 × 4 = 2 × a₀. This always happens!` },
  ];

  const guidedSteps = r === 2 ? guidedSteps2 : r === 17 ? guidedSteps17 : null;

  const sqrtPresets = [2, 3, 5, 7, 10, 13, 17, 19];

  return (
    <div>
      <TabIntro
        emoji="🔍"
        title="The √ Explorer"
        speech={[
          "What do you think about square roots? Do you think we can rewrite √2 in an RSS sequence?",
          "Here's the puzzle: √2 isn't a fraction, so how can RSS even work on it?",
          "Euler figured out a beautiful trick — rationalize the denominator! Let me show you.",
        ]}
        hint="Try the Guided Walkthrough for √2 or √17 first, then explore other square roots on your own!"
      />

      <div style={styles.sqrtControls}>
        <span style={styles.inputLabel}>Pick a number:</span>
        <div style={styles.presetRow}>
          {sqrtPresets.map(n => (
            <button key={n} onClick={() => { setR(n); setGuidedStep(0); }}
              style={{ ...styles.presetBtn, ...(r === n ? styles.presetActive : {}) }}>
              √{n}
            </button>
          ))}
        </div>
      </div>

      {isPerfect ? (
        <div style={styles.perfectSquareMsg}>
          ✅ {r} is a perfect square! √{r} = {isqrt}. No continued fraction needed — it's already a whole number!
        </div>
      ) : (
        <>
          <div style={styles.modeToggle}>
            {(r === 2 || r === 17) && (
              <button style={{ ...styles.modeBtn, ...(showGuided ? styles.modeBtnActive : {}) }}
                onClick={() => setShowGuided(true)}>
                📖 Guided Walkthrough
              </button>
            )}
            <button style={{ ...styles.modeBtn, ...(!showGuided ? styles.modeBtnActive : {}) }}
              onClick={() => setShowGuided(false)}>
              🔬 Free Exploration
            </button>
          </div>

          {showGuided && guidedSteps ? (
            <div style={styles.guidedContainer}>
              <div style={styles.guidedProgress}>
                {guidedSteps.map((_, i) => (
                  <div key={i} style={{
                    ...styles.guidedDot,
                    background: i <= guidedStep ? COLORS.primary : COLORS.border,
                    transform: i === guidedStep ? "scale(1.3)" : "scale(1)",
                  }} />
                ))}
              </div>
              <div style={styles.guidedCard}>
                <h3 style={{ color: COLORS.primary, margin: "0 0 12px" }}>
                  Step {guidedStep + 1}: {guidedSteps[guidedStep].title}
                </h3>
                <pre style={styles.guidedContent}>{guidedSteps[guidedStep].content}</pre>
              </div>
              <div style={{ display: "flex", gap: 10, justifyContent: "center" }}>
                <button style={styles.playBtn} disabled={guidedStep === 0}
                  onClick={() => setGuidedStep(s => s - 1)}>← Back</button>
                <button style={styles.playBtn} disabled={guidedStep === guidedSteps.length - 1}
                  onClick={() => setGuidedStep(s => s + 1)}>Next →</button>
              </div>
            </div>
          ) : (
            <div style={styles.explorerGrid}>
              <div style={styles.explorerCard}>
                <h3 style={styles.cardTitle}>Algorithm Steps</h3>
                <div style={styles.algoHeader}>
                  √{r} ≈ {Math.sqrt(r).toFixed(6)} → a₀ = {cf.a0}
                </div>
                <div style={styles.algoHeader}>
                  State at each step: (√{r} + m) / d
                </div>
                <table style={styles.algoTable}>
                  <thead>
                    <tr>
                      <th style={styles.th}>Step</th>
                      <th style={styles.th}>State</th>
                      <th style={styles.th}>aₙ</th>
                      <th style={styles.th}>m→</th>
                      <th style={styles.th}>d→</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr style={styles.algoRow}>
                      <td style={styles.td}>0</td>
                      <td style={styles.td}>√{r}</td>
                      <td style={{ ...styles.td, color: COLORS.primary, fontWeight: 800 }}>{cf.a0}</td>
                      <td style={styles.td}>{cf.a0}</td>
                      <td style={styles.td}>{r - cf.a0 * cf.a0}</td>
                    </tr>
                    {cf.states?.map((s, i) => (
                      <tr key={i} style={{
                        ...styles.algoRow,
                        background: i === cf.states.length - 1 ? "#FFF0E5" : "transparent"
                      }}>
                        <td style={styles.td}>{i + 1}</td>
                        <td style={styles.td}>(√{r}+{s.m})/{s.d}</td>
                        <td style={{ ...styles.td, color: COLORS.primary, fontWeight: 800 }}>{s.an}</td>
                        <td style={styles.td}>{s.mNext}</td>
                        <td style={styles.td}>{s.dNext}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              <div style={styles.explorerCard}>
                <h3 style={styles.cardTitle}>Results</h3>
                <div style={styles.cfResult}>
                  <div style={styles.cfLabel}>RSS Recipe:</div>
                  <code style={styles.cfCode}>
                    [{cf.a0}; ({cf.period.join(", ")})]
                  </code>
                </div>
                <div style={styles.cfResult}>
                  <div style={styles.cfLabel}>Period length:</div>
                  <b style={{ color: COLORS.purple, fontSize: 20 }}>{cf.period.length}</b>
                </div>
                <div style={styles.cfResult}>
                  <div style={styles.cfLabel}>Last term = 2 × a₀?</div>
                  <b style={{ color: COLORS.secondary }}>
                    {cf.period[cf.period.length - 1]} = 2 × {cf.a0} ✓ (always true!)
                  </b>
                </div>
                <div style={styles.cfResult}>
                  <div style={styles.cfLabel}>Palindrome check:</div>
                  {(() => {
                    const inner = cf.period.slice(0, -1);
                    const rev = [...inner].reverse();
                    const isPalin = inner.every((v, i) => v === rev[i]);
                    return <b style={{ color: COLORS.secondary }}>
                      [{inner.join(",")}] → {isPalin ? "Yes! ✨" : "Checking..."}
                    </b>;
                  })()}
                </div>
                <h3 style={{ ...styles.cardTitle, marginTop: 20 }}>Best Rational Approximations</h3>
                <div style={{ fontSize: 13, lineHeight: 2 }}>
                  {cf.convergents.slice(0, 8).map((c, i) => (
                    <div key={i} style={styles.convergentRow}>
                      <span style={styles.convergentFrac}>{c.p}/{c.q}</span>
                      <span style={{ color: COLORS.textLight }}>= {(c.p / c.q).toFixed(6)}</span>
                      <span style={{ color: COLORS.purple, fontSize: 11 }}>
                        (error: {Math.abs(c.p / c.q - Math.sqrt(r)).toExponential(1)})
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          <div style={styles.sqrtApproxSection}>
            <h3 style={{ ...styles.cardTitle, marginBottom: 8 }}>Rectangle Approximations of √{r}</h3>
            <p style={styles.sqrtApproxIntro}>
              Each convergent gives a rational rectangle that gets closer to the true shape of √{r}.
              As the recipe grows, the rectangle art becomes a better approximation.
            </p>
            <div style={styles.sqrtApproxGrid}>
              {sqrtApprox.map((c, i) => (
                <div key={i} style={styles.compareCard}>
                  <RectViz a={c.p} b={c.q}
                    label={`${c.p}/${c.q} ≈ ${(c.p / c.q).toFixed(4)}`}
                    compact />
                </div>
              ))}
            </div>
          </div>
        </>
      )}
    </div>
  );
}

/* ─────────────── TAB 4: RECTANGLE ART ─────────────── */
function RectViz({ a, b, label, compact = false, visibleGroup = null, activeGroup = null, showControls = !compact, hideFooter = false }) {
  const steps = useMemo(() => euclideanSteps(a, b), [a, b]);
  const squares = useMemo(() => buildSquares(a, b, steps), [a, b, steps]);
  const [hoveredGroup, setHoveredGroup] = useState(null);
  const [animStep, setAnimStep] = useState(-1);
  const [animating, setAnimating] = useState(false);

  useEffect(() => {
    if (animating && animStep < squares.length - 1) {
      const timer = setTimeout(() => setAnimStep(s => s + 1), 800);
      return () => clearTimeout(timer);
    }
    if (animStep >= squares.length - 1) setAnimating(false);
  }, [animating, animStep, squares.length]);

  const padding = compact ? 20 : 32;
  const maxW = compact ? 260 : 480;
  const maxH = compact ? 180 : 340;
  const scale = Math.min(maxW / a, maxH / b);
  const svgW = a * scale + padding * 2;
  const svgH = b * scale + padding * 2;
  const focusedGroup = hoveredGroup !== null ? hoveredGroup : activeGroup;

  return (
    <div style={{ textAlign: "center" }}>
      {label && <div style={styles.vizLabel}>{label}</div>}
      {showControls && !compact && (
        <div style={{ marginBottom: 8, display: "flex", gap: 8, justifyContent: "center" }}>
          <button style={styles.smallBtn} onClick={() => { setAnimStep(-1); setAnimating(false); }}>Show All</button>
          <button style={styles.smallBtn} onClick={() => { setAnimStep(0); setAnimating(true); }}>▶ Animate</button>
        </div>
      )}
      <svg width={svgW} height={svgH} viewBox={`0 0 ${svgW} ${svgH}`}>
        <rect x={padding - 1} y={padding - 1} width={a * scale + 2} height={b * scale + 2}
          fill="none" stroke={COLORS.border} strokeWidth={2} rx={3} />
        {squares.map((sq, i) => {
          const sx = sq.x * scale + padding, sy = sq.y * scale + padding, ss = sq.size * scale;
          const isFocused = focusedGroup === sq.group;
          const visible = visibleGroup === null ? animStep === -1 || i <= animStep : visibleGroup === -1 || sq.group <= visibleGroup;
          const opacity = !visible ? 0 : focusedGroup === null ? 0.8 : isFocused ? 1 : 0.3;
          return (
            <g key={i} onMouseEnter={() => setHoveredGroup(sq.group)} onMouseLeave={() => setHoveredGroup(null)}
              style={{ cursor: "pointer" }}>
              <rect x={sx} y={sy} width={ss} height={ss}
                fill={SQUARE_COLORS[sq.colorIdx]} fillOpacity={opacity}
                stroke={isFocused ? COLORS.text : "#fff"} strokeWidth={isFocused ? 2.5 : 1}
                rx={2}
                style={{ transition: "all 0.6s ease" }} />
              {ss > (compact ? 22 : 28) && visible && (
                <text x={sx + ss / 2} y={sy + ss / 2} textAnchor="middle" dominantBaseline="central"
                  fill={COLORS.text} fontSize={Math.min(compact ? 9 : 12, ss * 0.16)}
                  fontFamily="inherit" fontWeight={700} style={{ opacity: isFocused ? 1 : 0.7 }}>
                  {`${sq.size} x ${sq.size}`}
                </text>
              )}
            </g>
          );
        })}
        {/* Spiral arcs */}
        {(() => {
          const arcs = [];
          let x = 0, y = 0, horizontal = true, w = a, h = b;
          steps.forEach((step, stepIdx) => {
            for (let i = 0; i < step.q; i++) {
              const side = horizontal ? h : w;
              const sx = x * scale + padding, sy = y * scale + padding, ss = side * scale;
              const orient = arcs.length % 4;
              let s1, s2;
              if (orient === 0) { s1 = { x: sx + ss, y: sy }; s2 = { x: sx, y: sy + ss }; }
              else if (orient === 1) { s1 = { x: sx + ss, y: sy + ss }; s2 = { x: sx, y: sy }; }
              else if (orient === 2) { s1 = { x: sx, y: sy + ss }; s2 = { x: sx + ss, y: sy }; }
              else { s1 = { x: sx, y: sy }; s2 = { x: sx + ss, y: sy + ss }; }
              const visible2 = visibleGroup === null ? animStep === -1 || arcs.length <= animStep : visibleGroup === -1 || stepIdx <= visibleGroup;
              arcs.push(<path key={arcs.length}
                d={`M ${s1.x} ${s1.y} A ${ss} ${ss} 0 0 1 ${s2.x} ${s2.y}`}
                fill="none" stroke={COLORS.primary} strokeWidth={Math.max(1, ss * 0.015)}
                strokeLinecap="round" opacity={visible2 ? 0.5 : 0} style={{ transition: "opacity 0.6s" }} />);
              if (horizontal) x += side; else y += side;
            }
            if (horizontal) w -= step.q * h; else h -= step.q * w;
            horizontal = !horizontal;
          });
          return arcs;
        })()}
        <text x={padding + a * scale / 2} y={padding - 8} textAnchor="middle"
          fill={COLORS.textLight} fontSize={compact ? 10 : 12} fontFamily="inherit" fontWeight={600}>{a}</text>
        <text x={padding - 10} y={padding + b * scale / 2} textAnchor="middle"
          fill={COLORS.textLight} fontSize={compact ? 10 : 12} fontFamily="inherit" fontWeight={600}
          transform={`rotate(-90,${padding - 10},${padding + b * scale / 2})`}>{b}</text>
      </svg>
      {!hideFooter && (
        <div style={{ fontSize: 11, color: COLORS.textLight, marginTop: 4 }}>
          {formatRRSRecipe(steps.map(s => s.q))} — {steps.length} steps, {steps.reduce((s, st) => s + st.q, 0)} squares
        </div>
      )}
    </div>
  );
}

                    <b>Final RRS step:</b> {smallestStep.a} ÷ {smallestStep.b} = {smallestStep.q} remainder 0
                  </div>
                  <div style={styles.gcfProofBox}>
                    Since the process ends with squares of side length <b>{smallestStep.b}</b>, the GCF is <b>{smallestStep.b}</b>.
                  </div>
                  <div style={styles.gcfProofBox}>
                    Traditional method and RRS agree: <b>GCF({a}, {b}) = {gcfValue}</b>.

function TabPi() {
  // π's continued fraction: [3; 7, 15, 1, 292, 1, 1, 1, 2, 1, ...]
  const piCF = [3, 7, 15, 1, 292];
  const [revealed, setRevealed] = useState(1); // columns revealed
  const [showQp, setShowQp] = useState(false);

  const PI = Math.PI;

  // Build Euler's table: for each column, generate all semiconvergents
  const columns = useMemo(() => {
    const cols = [];
    // convergents: p_{-1}/q_{-1} = 1/0, p_0/q_0 = a_0/1
    let pPrev = 1, qPrev = 0, pCurr = piCF[0], qCurr = 1;
    cols.push({ header: piCF[0], entries: [{ p: pCurr, q: qCurr, principal: true }] });

    for (let k = 1; k < piCF.length; k++) {
      const ak = piCF[k];
      const entries = [];
      // semiconvergents: (i * pCurr + pPrev) / (i * qCurr + qPrev) for i = 1..ak
      for (let i = 1; i <= Math.min(ak, 15); i++) {
        entries.push({
          p: i * pCurr + pPrev,
          q: i * qCurr + qPrev,
          principal: i === ak,
        });
      }
      if (ak > 15) entries.push({ ellipsis: true, total: ak });
      cols.push({ header: ak, entries });
      // advance
      const pNext = ak * pCurr + pPrev;
      const qNext = ak * qCurr + qPrev;
      pPrev = pCurr; qPrev = qCurr;
      pCurr = pNext; qCurr = qNext;
    }
    return cols;
  }, []);

  return (
    <div>
      <div style={styles.sectionIntro}>
        <h2 style={styles.sectionTitle}>🥧 Pi Explorer</h2>
        <p style={styles.sectionDesc}>
          Euler built a table to find the best fractions that approximate π.
          Each column has <b>semiconvergents</b> (good guesses) that build up to a <b>principal convergent</b> (the best one so far)!
        </p>
        <p style={{ ...styles.sectionDesc, fontSize: 13, marginTop: 8 }}>
          π = [{piCF.join("; ").replace(";", ";")}...] — each column header is one term in π's RSS recipe.
        </p>
      </div>

      <div style={styles.controlRow}>
        <span style={styles.inputLabel}>Reveal columns:</span>
        {piCF.map((_, i) => (
          <button key={i} onClick={() => setRevealed(i + 1)}
            style={{ ...styles.presetBtn, ...(revealed === i + 1 ? styles.presetActive : {}) }}>
            {i + 1}
          </button>
        ))}
        <button style={{ ...styles.modeBtn, marginLeft: "auto" }}
          onClick={() => setShowQp(!showQp)}>
          {showQp ? "Show p/q" : "Show |qπ − p|"}
        </button>
      </div>

      <div style={styles.piTableWrap}>
        <div style={styles.piTable}>
          {columns.slice(0, revealed).map((col, ci) => (
            <div key={ci} style={styles.piCol}>
              <div style={styles.piColHeader}>{col.header}</div>
              <div style={styles.piColBody}>
                {col.entries.map((e, ei) => {
                  if (e.ellipsis) return (
                    <div key={ei} style={{ ...styles.piCell, fontStyle: "italic", color: COLORS.textLight }}>
                      ... ({e.total} total)
                    </div>
                  );
                  const qpVal = Math.abs(e.q * PI - e.p);
                  const decVal = e.p / e.q;
                  const overUnder = decVal > PI ? "↑" : "↓";
                  return (
                    <div key={ei} style={{
                      ...styles.piCell,
                      ...(e.principal ? styles.piCellPrincipal : {}),
                    }}>
                      <div style={styles.piFrac}>
                        <div style={styles.piNum}>{e.p}</div>
                        <div style={styles.piDen}>{e.q}</div>
                      </div>
                      <div style={styles.piMeta}>
                        {showQp ? qpVal.toFixed(4) : decVal.toFixed(4)}{" "}
                        <span style={{ color: decVal > PI ? COLORS.pink : COLORS.secondary }}>{overUnder}</span>
                      </div>
                      {e.principal && <div style={styles.piPrincipalTag}>★ principal</div>}
                    </div>
                  );
                })}
              </div>
            </div>
          ))}
        </div>
      </div>

      <div style={styles.insightBox}>
        <h3 style={{ margin: "0 0 8px", color: COLORS.primary }}>💡 Things to Notice</h3>
        <div style={{ fontSize: 13, lineHeight: 1.7 }}>
          <p style={{ margin: "4px 0" }}>
            <b>⬆️⬇️ Alternating:</b> Principal convergents flip between over and under π (3/1 is under, 22/7 is over, 333/106 is under, 355/113 is over...).
          </p>
          <p style={{ margin: "4px 0" }}>
            <b>★ Principal vs semi:</b> The principal convergent in each column is the first fraction where <code>|qπ − p|</code> beats ALL previous principal convergents. Click "Show |qπ − p|" to see!
          </p>
          <p style={{ margin: "4px 0" }}>
            <b>🎯 Famous ones:</b> 22/7 (Archimedes' approximation), 355/113 (Zu Chongzhi, 480 CE — accurate to 6 decimals!).
          </p>
          <p style={{ margin: "4px 0" }}>
            <b>🤯 The 292 mystery:</b> Column 5 has <b>292</b> entries because π's continued fraction has a HUGE term there. That's why 355/113 is so unusually accurate — the next correction is tiny!
          </p>
        </div>
      </div>
    </div>
  );
}

/* ─────────────── STORY: NUMBER Q ─────────────── */
function StoryNumberQ({ onContinue, onSkip }) {
  const [text, setText] = useState("");

  const detect = (input) => {
    const found = { whole: false, fraction: false, decimal: false, negative: false, irrational: false, empty: false };
    const trimmed = input.trim();
    // "I don't know" / "not sure" / empty → treat as no-input
    // Uses .test() on normalized lowercase to handle "I'm not sure", "dunno", etc.
    const lower = trimmed.toLowerCase();
    if (!trimmed ||
        /^\?+$/.test(lower) ||
        /^hmm+$/.test(lower) ||
        /\b(don'?t know|dunno|idk|no idea|not sure|unsure|nothing)\b/.test(lower)) {
      found.empty = true;
      return found;
    }
    if (/\b\d+\b/.test(input)) found.whole = true;
    if (/\d+\s*\/\s*\d+|fraction/i.test(input)) found.fraction = true;
    if (/\d+\.\d+|decimal/i.test(input)) found.decimal = true;
    if (/(^|\s|,)-\d+|negative/i.test(input)) found.negative = true;
    // More specific irrational detection: require word boundaries and actual math symbols
    if (/√|\bsqrt\b|\bpi\b|π|\birrational\b|∞|\binfinity\b|(^|\s)e($|\s|,)/i.test(input)) found.irrational = true;
    return found;
  };

  const handleShare = () => {
    onContinue(detect(text), text);
  };

  return (
    <div style={styles.storyScreen}>
      <div style={{ fontSize: 48, marginBottom: 12 }}>🤔</div>
      <h2 style={styles.storyTitle}>What do you think is a number?</h2>
      <p style={{ ...styles.storyBigText, fontSize: 16 }}>
        Type any numbers or ideas that come to mind!
      </p>
      <textarea
        style={styles.storyTextarea}
        value={text}
        onChange={e => setText(e.target.value)}
        placeholder="e.g. 1, 2, 3... or 1/2, √2, π, anything!"
        rows={3}
      />
      <div style={{ display: "flex", gap: 10, marginTop: 16, flexWrap: "wrap", justifyContent: "center" }}>
        <button style={styles.bigBtn} onClick={handleShare} disabled={!text.trim()}>Share!</button>
        <button style={styles.skipBtn} onClick={onSkip}>Skip →</button>
      </div>
    </div>
  );
}

/* ─────────────── MAIN APP ─────────────── */
function NumberSandbox() {
  const [mode, setMode] = useState("story");
  const [storyStep, setStoryStep] = useState("welcome");
  const [detected, setDetected] = useState({});
  const [userText, setUserText] = useState("");
  const [tab, setTab] = useState(0);
  const [visitedBranches, setVisitedBranches] = useState(new Set());

  const tabs = [TabRSS, TabBackwardRRS, TabGCF, TabSqrt, TabPi, TabMap, TabArt];
  const ActiveTab = tabs[tab];

  const restartStory = () => {
    setMode("story");
    setStoryStep("welcome");
    setVisitedBranches(new Set());
    setDetected({});
    setUserText("");
  };

  const handlePickBranch = (branchId) => {
    setTab(branchId);
    setVisitedBranches(prev => new Set([...prev, branchId]));
    setMode("branch");
  };

  const returnToTree = () => {
    setMode("story");
    setStoryStep("tree");
  };

  const renderStory = () => {
    if (storyStep === "welcome") return <StoryWelcome onStart={() => setStoryStep("numberQ")} />;
    if (storyStep === "numberQ") return <StoryNumberQ
      onContinue={(d, t) => { setDetected(d); setUserText(t); setStoryStep("reaction"); }}
      onSkip={() => setStoryStep("rssIntro")} />;
    if (storyStep === "reaction") return <StoryReaction detected={detected} userText={userText}
      onContinue={() => setStoryStep("rssIntro")} />;
    if (storyStep === "rssIntro") return <StoryRSSIntro onContinue={() => setStoryStep("rssMachine")} />;
    if (storyStep === "rssMachine") return (
      <div>
        <div style={styles.storyBanner}>
          📖 <b>Story Mode:</b> Try out the RSS Machine below, then continue when ready.
          <button style={styles.skipBtn} onClick={() => setStoryStep("tree")}>I'm ready →</button>
        </div>
        <TabRSS />
      </div>
    );
    if (storyStep === "tree") return <StoryTree visited={visitedBranches} onPickBranch={handlePickBranch} />;
    return null;
  };

  return (
    <div style={styles.app}>
      <div style={styles.container}>
        <header style={styles.header}>
          <h1 style={styles.title}>
            <span style={styles.titleEmoji}>🏖️</span>
            Number Sandbox
          </h1>
          <p style={styles.headerDesc}>
            Explore how numbers break apart, form patterns, and make art!
          </p>
        </header>

        {/* Mode toggle + restart */}
        <div style={styles.topBar}>
          <div style={styles.modePills}>
            <button style={{ ...styles.modePill, ...(mode === "story" ? styles.modePillActive : {}) }}
              onClick={() => setMode("story")}>📖 Story Mode</button>
            <button style={{ ...styles.modePill, ...(mode === "explore" ? styles.modePillActive : {}) }}
              onClick={() => setMode("explore")}>🔧 Free Explore</button>
          </div>
          {mode === "story" && (
            <button style={styles.restartBtn} onClick={restartStory}>↺ Restart Story</button>
          )}
        </div>

        {mode === "story" && (
          <main style={styles.main}>{renderStory()}</main>
        )}

        {mode === "branch" && (
          <>
            <div style={styles.storyBanner}>
              🌳 Exploring branch: <b>{TAB_NAMES[tab]}</b>
              <button style={styles.skipBtn} onClick={returnToTree}>← Back to Tree</button>
            </div>
            <main style={styles.main}><ActiveTab /></main>
          </>
        )}

        {mode === "explore" && (
          <>
            <nav style={styles.tabBar}>
              {TAB_NAMES.map((name, i) => (
                <button key={i} onClick={() => setTab(i)}
                  style={{ ...styles.tab, ...(tab === i ? styles.tabActive : {}) }}>
                  <span style={styles.tabIcon}>{TAB_ICONS[i]}</span>
                  <span style={styles.tabLabel}>{name}</span>
                </button>
              ))}
            </nav>
            <main style={styles.main}><ActiveTab /></main>
          </>
        )}

        <footer style={styles.footer}>Made with math & curiosity ✨</footer>
      </div>
    </div>
  );
}

  },
  piColBody: { display: "flex", flexDirection: "column", gap: 6, width: "100%" },

    background: "#fff", borderRadius: 10, padding: "8px 12px",

    transition: "all 0.2s",
  },
  piCellPrincipal: {
    background: `${COLORS.accent}40`,
    border: `2px solid ${COLORS.primary}`,

  piFrac: {
    display: "flex", flexDirection: "column", alignItems: "center",
    fontWeight: 800, fontSize: 14,
  },
  piNum: { borderBottom: `2px solid ${COLORS.text}`, padding: "0 8px", color: COLORS.text },
  piDen: { padding: "0 8px", color: COLORS.text },
  piMeta: {
    fontSize: 10, color: COLORS.textLight, marginTop: 4,
    fontFamily: "monospace", fontWeight: 700,

    border: `3px solid ${COLORS.accent}`,

  teacherBubble: {
    position: "relative", flex: 1,
    background: "#fff", borderRadius: 16,
    padding: "14px 18px", fontSize: 15, fontWeight: 600,
    lineHeight: 1.5, color: COLORS.text,
    boxShadow: "0 2px 10px rgba(0,0,0,0.08)",
    border: `2px solid ${COLORS.border}`,
    minHeight: 24,

  teacherCursor: {
    display: "inline-block", marginLeft: 2,
    color: COLORS.primary, fontWeight: 700,
    animation: "blink 1s infinite",
  },
  tutorialCard: {

    borderRadius: 18, padding: 20,
    border: `3px dashed ${COLORS.accent}`,

  tutorialHighlight: {
    borderColor: COLORS.primary,
    boxShadow: `0 0 0 4px ${COLORS.primary}20`,

  tutorialActions: {
    display: "flex", gap: 10, justifyContent: "center",
    marginTop: 12, flexWrap: "wrap",

  tutorialOptions: {
    display: "flex", gap: 10, flexWrap: "wrap", justifyContent: "center",
    marginTop: 8,
  },
  tutorialOption: {
    padding: "12px 18px", fontSize: 13, fontWeight: 700,
    background: "#fff", color: COLORS.text,

    transition: "all 0.2s", minWidth: 120,
  },
  tutorialOptionActive: {
    background: `${COLORS.primary}15`,

    transform: "scale(1.03)",

  tutorialOrDivider: {
    width: "100%", textAlign: "center",
    fontSize: 12, color: COLORS.textLight, fontWeight: 600,
    margin: "4px 0",

  tutorialDone: {
    background: `${COLORS.secondary}15`,
    borderRadius: 14, padding: 16,
    border: `2px solid ${COLORS.secondary}`,
    marginBottom: 20, textAlign: "center",
  },

  predictionCard: {
    background: `linear-gradient(135deg, #FFF8E1, #FFF0E5)`,
    borderRadius: 14, padding: 14,
    border: `2px solid ${COLORS.accent}`,
    marginBottom: 12,
    animation: "fadeIn 0.4s ease",
  },
  predictionBubble: {
    display: "flex", alignItems: "center", gap: 10,
    fontSize: 13, fontWeight: 600, color: COLORS.text,
    marginBottom: 10,
  },
  predictionOptions: {
    display: "flex", gap: 8, flexWrap: "wrap",
  },
  predictionOption: {
    padding: "7px 14px", fontSize: 12, fontWeight: 700,

    border: `2px solid ${COLORS.border}`, borderRadius: 999,
    cursor: "pointer", fontFamily: "inherit",
    transition: "all 0.2s",
  },
  predictionOptionActive: {
    background: `${COLORS.primary}15`,
    borderColor: COLORS.primary,
    color: COLORS.primary,
  },
  predictionReady: {
    marginTop: 10, padding: "8px 12px",
    background: `${COLORS.secondary}15`, borderRadius: 10,

  threeCol: {
    display: "grid",

  qaCard: {
    background: `${COLORS.accent}20`,

    border: `2px solid ${COLORS.accent}`,
  },
  qaWaiting: {
    textAlign: "center", padding: "20px 10px",
    color: COLORS.textLight,
  },
  qaQuestion: {
    marginBottom: 14, paddingBottom: 14,
    borderBottom: `1px dashed ${COLORS.border}`,
  },
  qaTeacher: {
    display: "flex", gap: 8, alignItems: "flex-start",
    fontSize: 13, fontWeight: 600, color: COLORS.text,
    marginBottom: 8, lineHeight: 1.4,
  },
  qaInputRow: {
    display: "flex", gap: 6, alignItems: "center",
  },
  qaCorrect: {
    marginTop: 8, padding: "6px 10px",
    background: `${COLORS.secondary}20`, borderRadius: 8,
    fontSize: 12, fontWeight: 700, color: COLORS.secondary,
  },
  qaWrong: {
    marginTop: 8, padding: "6px 10px",
    background: "#FEE", borderRadius: 8,
    fontSize: 12, fontWeight: 700, color: "#C33",
  },
  seqReveal: {
    marginTop: 10,
    animation: "fadeIn 0.5s ease",
  },
  seqBox: {
    background: "#fff", borderRadius: 12, padding: 14,
    border: `2px solid ${COLORS.purple}40`,
    marginTop: 8,
  },
  seqFormula: {
    marginTop: 10, padding: "8px 10px",
    background: `${COLORS.purple}15`, borderRadius: 8,
    fontSize: 14, fontWeight: 800, fontFamily: "monospace",
    color: COLORS.purple, textAlign: "center",
  },
};
